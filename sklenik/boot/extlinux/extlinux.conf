# SKLENIK - start na Odroid C4 (cita ho zavadzac U-Boot; Raspberry Pi tento subor nepouziva)
# Jadro a popis hardveru su v priecinku odroid/, system v pamati je ten isty ako pre 64-bit Raspberry Pi.
TIMEOUT 1
DEFAULT sklenik

LABEL sklenik
  MENU LABEL SKLENIK
  LINUX /odroid/Image
  INITRD /initramfs8.cpio.gz
  FDT /odroid/meson-sm1-odroid-c4.dtb
  APPEND console=ttyAML0,115200 console=tty1 loglevel=3 quiet vt.global_cursor_default=0 panic=5 rdinit=/init
