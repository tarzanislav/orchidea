# SKLENIK - start na doskach Amlogic S905X3: Odroid C4 a X96 Max Plus (cita ho zavadzac U-Boot;
# Raspberry Pi tento subor nepouziva). Jadro je spolocne v priecinku amlogic/, system v pamati je ten isty
# ako pre 64-bit Raspberry Pi. Popis hardveru si zavadzac vyberie sam podla svojej dosky (premenna fdtfile):
#   Odroid C4    -> dtb/amlogic/meson-sm1-odroid-c4.dtb
#   X96 Max Plus -> dtb/amlogic/meson-sm1-x96-air-gbit.dtb (nas u-boot.ext; verzia s Ethernetom 100 Mb/s
#                   ma popis meson-sm1-x96-air.dtb)
TIMEOUT 1
DEFAULT sklenik

LABEL sklenik
  MENU LABEL SKLENIK
  LINUX /amlogic/Image
  INITRD /initramfs8.cpio.gz
  FDTDIR /dtb
  APPEND console=ttyAML0,115200 console=tty1 loglevel=3 quiet vt.global_cursor_default=0 panic=5 rdinit=/init
