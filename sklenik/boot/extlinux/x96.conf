# SKLENIK - X96 Max Plus (cita ho nas u-boot.ext pred spolocnym extlinux.conf). Obraz v 1080p: TV krabicka
# by inak bezala v 4K a obvody obrazu a HDMI by v plastovej krabicke zbytocne hriali (meranie 22. 11. 2026:
# 64-69 C pri 13 % vykonu procesora). Popis hardveru si vyberie zavadzac (fdtfile).
TIMEOUT 1
DEFAULT sklenik

LABEL sklenik
  MENU LABEL SKLENIK (X96 Max Plus)
  LINUX /amlogic/Image
  INITRD /initramfs8.cpio.gz
  FDTDIR /dtb
  APPEND console=ttyAML0,115200 console=tty1 loglevel=3 quiet vt.global_cursor_default=0 panic=5 rdinit=/init video=HDMI-A-1:1920x1080@60
