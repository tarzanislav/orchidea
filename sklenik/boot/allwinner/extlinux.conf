# SKLENIK - start na Tanix TX68 (Allwinner H618; cita ho zavadzac U-Boot zo zaciatku karty).
# Jadro je v priecinku allwinner/, system v pamati je ten isty ako pre 64-bit Raspberry Pi.
# Popis hardveru si U-Boot vyberie sam (fdtfile = allwinner/sun50i-h618-transpeed-8k618-t.dtb; na karte
# je upraveny pre TX68: meno, vsetky zasuvky USB, Wi-Fi bez napajania).
TIMEOUT 1
DEFAULT sklenik

LABEL sklenik
  MENU LABEL SKLENIK
  LINUX /allwinner/Image
  INITRD /initramfs8.cpio.gz
  FDTDIR /dtb
  APPEND console=ttyS0,115200 console=tty1 loglevel=3 quiet panic=5 rdinit=/init
