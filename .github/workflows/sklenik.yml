name: ORCHIDEA OS – univerzálna karta (Raspberry Pi, Odroid C4, TV krabičky)

on:
  push:
    paths:
      - "sklenik/**"
      - "nastroje/kontrola_odroid.py"
      - "nastroje/initramfs.py"
      - "nastroje/kontrola_karty.py"
      - "nastroje/kontrola_obrazovky.py"
      - "pismo/**"
      - "zariadenie/**"
      - "teplo/**"
      - "nastroje/kontrola_merania.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sklenik.yml"
  workflow_dispatch:

# R228: beh, ktorý už beží, dobehne (inak by ho každý push iného prúdu zrušil a jadro S905X3 sa nedostavalo do
# pamäte); čaká najviac jeden – najnovší – a karta sa potom zostaví z najnovšieho stavu
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # oficiálne jadro a firmvér Raspberry Pi – pevné verzie, aby bol obraz vždy rovnaký
  JADRO_TAG: stable_20250916
  FIRMVER_TAG: "1.20250915"
  # Odroid C4 (R88): hlavné jadro Linux s dlhodobou podporou, zavádzač U-Boot a podpísané časti Amlogic
  ODROID_JADRO: "6.18.64"
  UBOOT_TAG: v2026.10
  FIP_COMMIT: b54e3bbbcf5613d451230d359d264844eeda7166
  # Tanix TX68 (Allwinner H618, R118): ARM Trusted Firmware – časť BL31, ktorú U-Boot pre 64-bit Allwinner potrebuje
  TFA_TAG: v2.15.0

jobs:
  jadro:
    name: Jadro – ${{ matrix.meno }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: v6, meno: "ARMv6 (RPi 1, Zero, Zero W)", os: ubuntu-latest, arch: arm, cross: arm-linux-gnueabihf-,
              defconfig: bcmrpi_defconfig, ciel: zImage, subor: kernel.img, dtb: "bcm2708-*" }
          - { id: v7, meno: "ARMv7 (RPi 2)", os: ubuntu-latest, arch: arm, cross: arm-linux-gnueabihf-,
              defconfig: bcm2709_defconfig, ciel: zImage, subor: kernel7.img, dtb: "bcm2709-* bcm2710-rpi-2-b" }
          - { id: v8, meno: "64-bit (RPi 3, Zero 2 W, 4)", os: ubuntu-24.04-arm, arch: arm64, cross: "",
              defconfig: bcm2711_defconfig, ciel: Image.gz, subor: kernel8.img, dtb: "bcm2710-* bcm2711-* bcm2712*" }
          - { id: v8-2712, meno: "RPi 5 (BCM2712, stránky 16 kB)", os: ubuntu-24.04-arm, arch: arm64, cross: "",
              defconfig: bcm2712_defconfig, ciel: Image.gz, subor: kernel_2712.img, dtb: "" }
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
      CROSS_COMPILE: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@v5
      - name: Pamäť zostaveného jadra
        id: pamat
        uses: actions/cache/restore@v4
        with:
          path: jadro-vystup
          key: jadro-${{ matrix.id }}-${{ env.JADRO_TAG }}-${{ hashFiles('sklenik/jadro.config') }}
      - name: Jadro Raspberry Pi (oficiálne zdrojové kódy + nastavenie ORCHIDEA OS)
        if: steps.pamat.outputs.cache-hit != 'true'
        run: |
          sh nastroje/balicky.sh bc bison flex libssl-dev make gcc ${CROSS_COMPILE:+gcc-arm-linux-gnueabihf}
          curl -sSfL "https://github.com/raspberrypi/linux/archive/refs/tags/${JADRO_TAG}.tar.gz" | tar xz
          cd "linux-${JADRO_TAG}"
          make -s ${{ matrix.defconfig }}
          scripts/kconfig/merge_config.sh -m .config ../sklenik/jadro.config
          make -s olddefconfig
          make -s -j"$(nproc)" ${{ matrix.ciel }} ${{ matrix.dtb && 'dtbs' || '' }}
          mkdir -p ../jadro-vystup
          cp "arch/$ARCH/boot/${{ matrix.ciel }}" "../jadro-vystup/${{ matrix.subor }}"
          cp .config "../jadro-vystup/jadro-${{ matrix.id }}.config"
          set -f
          for vzor in ${{ matrix.dtb }}; do
            find "arch/$ARCH/boot/dts" -name "$vzor.dtb" -exec cp {} ../jadro-vystup/ \;
          done
          set +f
          ls -l ../jadro-vystup
      - name: Uloženie zostaveného jadra do pamäte
        if: steps.pamat.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: jadro-vystup
          key: ${{ steps.pamat.outputs.cache-primary-key }}
      - name: Kontrola nastavenia jadra
        run: |
          {
            echo "### Jadro ${{ matrix.meno }} – ${{ matrix.subor }} ($(du -h jadro-vystup/${{ matrix.subor }} | cut -f1))"
            grep -E '^(CONFIG_|# CONFIG_)' sklenik/jadro.config | while read -r riadok; do
              if grep -qxF "$riadok" "jadro-vystup/jadro-${{ matrix.id }}.config"; then echo "- ✅ \`$riadok\`"
              else echo "- ⚪ \`$riadok\` (pre tento procesor neplatí alebo ho jadro nastavilo inak)"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # R122: bez FAT a znakových sád v jadre by samomeranie nemohlo zapisovať na kartu
          for riadok in CONFIG_VFAT_FS=y CONFIG_NLS_CODEPAGE_437=y CONFIG_NLS_ISO8859_1=y; do
            grep -qxF "$riadok" "jadro-vystup/jadro-${{ matrix.id }}.config" || { echo "❌ $riadok chýba v jadre (samomeranie R122)"; exit 1; }
          done
          # R247: zberač meraní – IPv6 (adresy miestnej linky) priamo v jadre
          grep -qxF CONFIG_IPV6=y "jadro-vystup/jadro-${{ matrix.id }}.config" || { echo "❌ CONFIG_IPV6=y chýba v jadre (zberač R247)"; exit 1; }
          # R190: vlastný chladný obraz cez KMS potrebuje ovládač vc4 a CEC priamo v jadre
          for riadok in CONFIG_DRM_VC4=y CONFIG_DRM_VC4_HDMI_CEC=y; do
            grep -qxF "$riadok" "jadro-vystup/jadro-${{ matrix.id }}.config" || { echo "❌ $riadok chýba v jadre (obraz R190)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jadro-${{ matrix.id }}
          path: jadro-vystup

  klic:
    name: KLÍČ – ${{ matrix.meno }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: v6, meno: "ARMv6 (procesor ARM1176 – RPi 1, Zero)", os: ubuntu-latest,
              ciel: arm-unknown-linux-musleabihf, qemu: qemu-arm, cpu: arm1176, linker: arm-linux-gnueabihf-gcc }
          - { id: v7, meno: "ARMv7 (procesor Cortex-A7 – RPi 2)", os: ubuntu-latest,
              ciel: armv7-unknown-linux-musleabihf, qemu: qemu-arm, cpu: cortex-a7, linker: arm-linux-gnueabihf-gcc }
          - { id: v8, meno: "AArch64 (procesor Cortex-A53 – RPi 3, Zero 2 W, 4, 5)", os: ubuntu-24.04-arm,
              ciel: aarch64-unknown-linux-musl, qemu: qemu-aarch64, cpu: cortex-a53, linker: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Nástroje
        run: |
          sh nastroje/balicky.sh qemu-user ${{ matrix.linker && 'gcc-arm-linux-gnueabihf' || '' }}
          rustup toolchain install && rustup target add ${{ matrix.ciel }}
      - name: Zostavenie a skúšky na emulovanom procesore ${{ matrix.cpu }}
        run: |
          # verzia na obrazovke: dátum a odtlačok zostavenia (aby bolo vidieť, ktorá karta beží)
          export SKLENIK_VERZIA="$(date -u +'%-d. %-m. %Y') · ${GITHUB_SHA::7}"
          T=$(echo "${{ matrix.ciel }}" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${T}_RUNNER=${{ matrix.qemu }} -cpu ${{ matrix.cpu }}"
          if [ -n "${{ matrix.linker }}" ]; then export "CARGO_TARGET_${T}_LINKER=${{ matrix.linker }}"; fi
          # spoločné schopnosti ORCHIDEE (R204) sa skúšajú aj na procesoroch karty
          cargo test --locked --release -p sklenik-klic -p orchidea-zariadenie -p orchidea-teplo --target ${{ matrix.ciel }}
          cargo build --locked --release -p sklenik-klic --target ${{ matrix.ciel }}
          b="target/${{ matrix.ciel }}/release/klic"
          file "$b"
          ${{ matrix.qemu }} -cpu ${{ matrix.cpu }} "$b" --skuska
          mkdir -p klic-vystup && cp "$b" klic-vystup/klic
          # R223: program merania vlastného dekodéra HEVC (relácia B, rozhranie R4) pre ten istý procesor
          cargo build --locked --release -p orchidea-hevc-dekoder --example hevc_meranie --target ${{ matrix.ciel }}
          cp "target/${{ matrix.ciel }}/release/examples/hevc_meranie" klic-vystup/hevc_meranie
          file klic-vystup/hevc_meranie
      - name: R165 – skúšobné video KLÍČA overené nezávislým dekodérom (FFmpeg) bit po bite
        if: matrix.id == 'v8'
        run: |
          sh nastroje/balicky.sh ffmpeg
          mkdir -p /tmp/vid
          SKLENIK_VIDEO=/tmp/vid cargo test --locked --release -p sklenik-klic --target ${{ matrix.ciel }} -- --ignored zapis_skusobne_toky
          for f in h264 hevc; do
            ffmpeg -v error -i /tmp/vid/pcm.$f -f rawvideo -pix_fmt yuv420p -y /tmp/vid/dek.$f.yuv
            cmp /tmp/vid/dek.$f.yuv /tmp/vid/pcm.yuv && echo "- ✅ skúšobný tok $f: FFmpeg dekóduje presne vzor (bit po bite)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # R202: H.264 bez PCM (Intra 16×16, predikcia DC, koeficienty DC)
          ffmpeg -v error -i /tmp/vid/dc.h264 -f rawvideo -pix_fmt yuv420p -y /tmp/vid/dek.dc.yuv
          cmp /tmp/vid/dek.dc.yuv /tmp/vid/dc.yuv && echo "- ✅ skúšobný tok H.264 bez PCM (Intra 16×16 s DC): FFmpeg dekóduje presne (bit po bite)" | tee -a "$GITHUB_STEP_SUMMARY"
          # R177: HEVC so skupinami snímok – P-snímky s preskočenými jednotkami cez referenciu, časovanie VUI
          ffmpeg -v error -i /tmp/vid/gop.hevc -f rawvideo -pix_fmt yuv420p -y /tmp/vid/dek.gop.yuv
          cmp /tmp/vid/dek.gop.yuv /tmp/vid/gop.yuv && echo "- ✅ skúšobný tok HEVC so skupinami (P cez referenciu): FFmpeg dekóduje presne (bit po bite)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: R223 – skúšobné toky HEVC pre meranie na zariadení (x265, MD5 v SEI) a overenie programom merania
        if: matrix.id == 'v8'
        run: |
          mkdir -p klic-vystup/hevc
          z="-hide_banner -loglevel error -y -f lavfi"
          film() {
            ffmpeg $z -i "testsrc2=size=$2:rate=24" -frames:v 96 -c:v libx265 -preset fast -crf 23 -pix_fmt yuv420p \
              -x265-params "log-level=error:hash=1" "klic-vystup/hevc/$1.hevc"
          }
          film film720 1280x720
          film film1080 1920x1080
          ls -l klic-vystup/hevc
          for t in klic-vystup/hevc/*.hevc; do
            v=$(klic-vystup/hevc_meranie "$t" | grep '^VYSLEDOK')
            echo "- $(basename "$t"): $v" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$v" | grep -q 'stav=ok' && echo "$v" | grep -q 'sei_nezhoda=0'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: klic-${{ matrix.id }}
          path: klic-vystup

  jadro-odroid:
    name: Jadro – Amlogic S905X3 (Odroid C4, X96 Max Plus; hlavné jadro Linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Pamäť zostaveného jadra
        id: pamat
        uses: actions/cache/restore@v4
        with:
          path: jadro-vystup
          key: jadro-s905x3-${{ env.ODROID_JADRO }}-${{ hashFiles('sklenik/jadro.config', 'sklenik/jadro-odroid.config', 'sklenik/jadro-ovladace/*') }}
      - name: Jadro Linux z kernel.org + nastavenie ORCHIDEA OS pre Odroid C4
        if: steps.pamat.outputs.cache-hit != 'true'
        run: |
          sh nastroje/balicky.sh bc bison flex libssl-dev make gcc xz-utils
          curl -sSfL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${ODROID_JADRO}.tar.xz" | tar xJ
          cd "linux-${ODROID_JADRO}"
          # R166: vlastné ovládače SKLENÍKA priamo v jadre (takt obvodu obrazu VPU podľa potreby)
          cp ../sklenik/jadro-ovladace/sklenik_vpu.c drivers/soc/amlogic/
          echo 'obj-y += sklenik_vpu.o' >> drivers/soc/amlogic/Makefile
          # R174: vlastný kodek HEVC v jadre meson-vdec (formát HEVC pre SM1, prívod toku podľa voľných snímok)
          cp ../sklenik/jadro-ovladace/sklenik_hevc.c ../sklenik/jadro-ovladace/sklenik_hevc.h drivers/staging/media/meson/vdec/
          patch -p1 --forward < ../sklenik/jadro-ovladace/sklenik-hevc.patch
          # R187: Full HD bez kódovania signálu (scrambling) aj pri televízore, ktorý ho podporuje – ako RPi; prepínač
          # /sys/module/dw_hdmi/parameters/sklenik_bez_kodovania (KLÍČ: hdmi_bez_kodovania=nie vráti kódovanie)
          patch -p1 --forward < ../sklenik/jadro-ovladace/sklenik-hdmi.patch
          # R189: karta SD, ktorá neprečíta voliteľné rozširujúce registre, sa už nezahodí; strop taktu SD
          # (/sys/module/mmc_core/parameters/sklenik_sd_max_khz) – KLÍČ ho zníži, keď karta opakovane zlyháva
          patch -p1 --forward < ../sklenik/jadro-ovladace/sklenik-sd.patch
          # R237: pokusné zápisy do registrov dekodéra VDEC_1 (chyba H.264 na SM1) –
          # /sys/module/meson_vdec/parameters/sklenik_zapisy, KLÍČ ho nastavuje len počas skúšky videa
          patch -p1 --forward < ../sklenik/jadro-ovladace/sklenik-vdec1.patch
          grep -q sklenik_zapisy drivers/staging/media/meson/vdec/vdec_1.c || { echo "úprava R237 sa neuplatnila"; exit 1; }
          grep -q sklenik_sd_max_khz drivers/mmc/core/sd.c || { echo "úprava R189 sa neuplatnila"; exit 1; }
          grep -q sklenik_bez_kodovania drivers/gpu/drm/bridge/synopsys/dw-hdmi.c || { echo "úprava R187 sa neuplatnila"; exit 1; }
          # R167: vlastný ovládač hlbokého spánku jadier (cpuidle cez PSCI) – pri štarte vypnutý, zapína ho KLÍČ
          cp ../sklenik/jadro-ovladace/sklenik_jadra.c drivers/cpuidle/
          echo 'obj-$(CONFIG_ARM_PSCI_FW) += sklenik_jadra.o' >> drivers/cpuidle/Makefile
          # R186: vlastný spoločný časovač budenia (Timer F mimo zhluku jadier) – hlboko môže spať aj cpu0; zapína ho KLÍČ
          cp ../sklenik/jadro-ovladace/sklenik_casovac.c drivers/clocksource/
          echo 'obj-$(CONFIG_GENERIC_CLOCKEVENTS_BROADCAST) += sklenik_casovac.o' >> drivers/clocksource/Makefile
          # R165/R174: firmvér dekodéra videa (mikrokód jeho procesora AMRISC z linux-firmware) – overený odtlačkom
          # SHA-256; na karte ako samostatné súbory s menami 8.3 (licencia LICENSE.amlogic_vdec nedovoľuje vložiť ho
          # do jadra), KLÍČ ich pri štarte skopíruje do /lib/firmware
          lf="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
          lg="https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main"
          mkdir -p ../jadro-vystup/amlogic/vdec
          stiahni() { curl -sSfL --retry 3 -o "$2" "$lf/$1" || curl -sSfL --retry 3 -o "$2" "$lg/$1"; }
          for z in g12a_h264.bin:g12ah264.bin:ed2014edb5b759654956b829770181b46efb91c68a2e6c6510c354ffdcbe1a0a \
                   sm1_vp9_mmu.bin:sm1vp9.bin:a999eac69ec6d87785951b11eb53bc2c8e5fc3e464a356411cb2f646c68e2b1a \
                   gxl_mpeg12.bin:gxlmpg12.bin:4a851302785a48e84cb846e5e974a4f51a4ca87c52d961aab4307b1c91daf2b2 \
                   sm1_hevc_mmu.bin:sm1hevc.bin:f98249d9586a66a5e747b386f9eba76a670efbbcf0d744612387febb3b2b0d2a; do
            povodne=${z%%:*}; zvysok=${z#*:}; kratke=${zvysok%%:*}; odtlacok=${zvysok#*:}
            stiahni "meson/vdec/$povodne" "../jadro-vystup/amlogic/vdec/$kratke"
            echo "$odtlacok  ../jadro-vystup/amlogic/vdec/$kratke" | sha256sum -c -
          done
          l=../jadro-vystup/amlogic/vdec/licencia.txt
          stiahni LICENSE.amlogic_vdec "$l" || stiahni "LICENSE.amlogic_vdec?h=main" "$l" \
            || curl -sSfL --retry 3 -o "$l" https://scancode-licensedb.aboutcode.org/amlogic-linux-firmware.LICENSE
          grep -q "Amlogic" "$l" && head -3 "$l"
          make -s defconfig
          # platformy iných výrobcov preč – zostane len Amlogic Meson (procesor Odroidu C4)
          for a in $(grep -oE '^config ARCH_[A-Z0-9_]+' arch/arm64/Kconfig.platforms | cut -d' ' -f2); do
            [ "$a" = ARCH_MESON ] || scripts/config --disable "$a"
          done
          scripts/kconfig/merge_config.sh -m .config ../sklenik/jadro.config ../sklenik/jadro-odroid.config
          make -s olddefconfig
          # popisy hardvéru: Odroid C4 a referenčná doska krabičiek S905X3 (X96 Air – gigabit a 100 Mb/s) pre X96 Max Plus
          dtb="meson-sm1-odroid-c4 meson-sm1-x96-air-gbit meson-sm1-x96-air"
          make -s -j"$(nproc)" Image $(for d in $dtb; do printf 'amlogic/%s.dtb ' "$d"; done)
          grep -q sklenik_vpu_probe System.map || { echo "ovládač sklenik_vpu chýba v jadre"; exit 1; }
          grep -q " vdec_probe$" System.map || { echo "dekodér videa meson-vdec chýba v jadre"; exit 1; }
          grep -q " sklenik_hevc_ops$" System.map || { echo "vlastný kodek HEVC chýba v jadre"; exit 1; }
          grep -q " skl_nastav$" System.map || { echo "vlastný ovládač spánku jadier chýba v jadre"; exit 1; }
          grep -q " skl_prerusenie$" System.map || { echo "vlastný spoločný časovač budenia chýba v jadre"; exit 1; }
          # firmvér Amlogic nesmie byť v jadre (licencia)
          ! grep -q "^CONFIG_EXTRA_FIRMWARE=\".*meson" .config
          mkdir -p ../jadro-vystup/amlogic/dtb/amlogic
          cp arch/arm64/boot/Image ../jadro-vystup/amlogic/
          for d in $dtb; do cp "arch/arm64/boot/dts/amlogic/$d.dtb" ../jadro-vystup/amlogic/dtb/amlogic/; done
          cp .config ../jadro-vystup/amlogic/jadro-s905x3.config
          ls -lR ../jadro-vystup/amlogic
      - name: Uloženie zostaveného jadra do pamäte
        if: steps.pamat.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: jadro-vystup
          key: ${{ steps.pamat.outputs.cache-primary-key }}
      - name: Kontrola nastavenia jadra – ovládače Odroidu C4 musia byť priamo v jadre
        run: |
          k=jadro-vystup/amlogic/jadro-s905x3.config
          chyb=0
          {
            echo "### Jadro Amlogic S905X3 (Odroid C4, X96 Max Plus) – Linux ${ODROID_JADRO} ($(du -h jadro-vystup/amlogic/Image | cut -f1))"
            grep -qx "# CONFIG_MODULES is not set" "$k" && echo "- ✅ bez modulov (všetko v jadre)" || { echo "- ❌ jadro má moduly"; chyb=1; }
            for riadok in $(grep -E '^CONFIG_[A-Z0-9_]+=y$' sklenik/jadro-odroid.config); do
              if grep -qxF "$riadok" "$k"; then echo "- ✅ \`$riadok\`"; else echo "- ❌ \`$riadok\` chýba"; chyb=1; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for riadok in $(grep -E '^CONFIG_[A-Z0-9_]+=y$' sklenik/jadro-odroid.config); do grep -qxF "$riadok" "$k" || exit 1; done
          grep -qx "# CONFIG_MODULES is not set" "$k"
      - uses: actions/upload-artifact@v4
        with:
          name: jadro-s905x3
          path: jadro-vystup

  uboot-odroid:
    name: Zavádzače Amlogic (Odroid C4, X96 Max Plus)
    # nástroj Amlogic na podpísanie zavádzača existuje len pre procesory x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pamäť zostavených zavádzačov
        id: pamat
        uses: actions/cache/restore@v4
        with:
          path: uboot-vystup
          key: uboot-amlogic-${{ env.UBOOT_TAG }}-${{ env.FIP_COMMIT }}-${{ hashFiles('sklenik/boot/amlogic/*') }}
      - name: U-Boot (odroid-c4_defconfig) a podpísanie nástrojom Amlogic
        if: steps.pamat.outputs.cache-hit != 'true'
        run: |
          sh nastroje/balicky.sh build-essential bc bison flex libssl-dev libgnutls28-dev uuid-dev \
            python3-dev python3-setuptools python3-pyelftools swig gcc-aarch64-linux-gnu
          curl -sSfL "https://github.com/u-boot/u-boot/archive/refs/tags/${UBOOT_TAG}.tar.gz" | tar xz
          curl -sSfL "https://github.com/LibreELEC/amlogic-boot-fip/archive/${FIP_COMMIT}.tar.gz" | tar xz
          cp -r "u-boot-${UBOOT_TAG#v}" u-boot-x96
          cd "u-boot-${UBOOT_TAG#v}"
          make -s CROSS_COMPILE=aarch64-linux-gnu- odroid-c4_defconfig
          make -s -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-
          cd "../amlogic-boot-fip-${FIP_COMMIT}"
          mkdir -p ../uboot-vystup ../fip-vystup
          ./build-fip.sh odroid-c4 "../u-boot-${UBOOT_TAG#v}/u-boot.bin" ../fip-vystup
          cp ../fip-vystup/u-boot.bin.sd.bin ../uboot-vystup/
          ls -l ../fip-vystup ../uboot-vystup
      - name: X96 Max Plus – U-Boot na reťazové spustenie (u-boot.ext) a skripty pôvodného zavádzača (R117)
        if: steps.pamat.outputs.cache-hit != 'true'
        run: |
          # Krabička štartuje vždy z vlastnej pamäte eMMC (zavádzač Androidu). Ten po stlačení tlačidla v konektore
          # AV spustí aml_autoscript z karty, odvtedy pri každom štarte s905_autoscript a ten náš U-Boot – žiadne
          # podpisovanie ani zápis do krabičky okrem poradia štartu. U-Boot je zostavený pre referenčnú dosku
          # krabičiek s S905X3 (popis hardvéru X96 Air z hlavného Linuxu), pamäť nastavenia NIKDE (nikdy nezapisuje).
          cd u-boot-x96
          make -s CROSS_COMPILE=aarch64-linux-gnu- bananapi-m5_defconfig
          printf '#include "meson-sm1-u-boot.dtsi"\n' > arch/arm/dts/meson-sm1-x96-air-gbit-u-boot.dtsi
          scripts/config --set-str DEFAULT_DEVICE_TREE "amlogic/meson-sm1-x96-air-gbit" \
            --set-str IDENT_STRING " SKLENIK x96-max-plus" \
            --enable ENV_IS_NOWHERE --disable ENV_IS_IN_MMC --disable ENV_IS_IN_FAT \
            --set-val BOOTDELAY 1
          # USB kľúče, USB ako prvé, nápis na obrazovke (sklenik/boot/amlogic/x96-uboot.config)
          grep -v '^#' ../sklenik/boot/amlogic/x96-uboot.config >> .config
          make -s CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^CONFIG_(DEFAULT_DEVICE_TREE|ENV_IS_NOWHERE|TEXT_BASE|BOOTDELAY|USB_STORAGE|BOOTCOMMAND|VIDEO_MESON)=' .config
          for k in USB_STORAGE CMD_USB FS_FAT USB_XHCI_DWC3 USB_DWC3_MESON_G12A; do
            grep -qx "CONFIG_$k=y" .config || { echo "U-Boot pre X96 nemá CONFIG_$k"; exit 1; }
          done
          if grep -E '^CONFIG_ENV_IS_IN_[A-Z0-9_]+=y' .config; then echo "U-Boot by zapisoval nastavenie"; exit 1; fi
          make -s -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p ../uboot-vystup/x96
          cp u-boot.bin ../uboot-vystup/x96/u-boot.ext
          for s in aml_autoscript s905_autoscript; do
            grep -v '^#' "../sklenik/boot/amlogic/$s.cmd" > "/tmp/$s.txt"
            tools/mkimage -C none -A arm -T script -n "SKLENIK $s" -d "/tmp/$s.txt" "../uboot-vystup/x96/$s"
          done
          ls -l ../uboot-vystup/x96
      - name: Uloženie zostavených zavádzačov do pamäte
        if: steps.pamat.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: uboot-vystup
          key: ${{ steps.pamat.outputs.cache-primary-key }}
      - name: Kontrola – zavádzač Odroidu sa zmestí pred oddiel karty (4 MiB), u-boot.ext je U-Boot
        run: |
          v=$(stat -c %s uboot-vystup/u-boot.bin.sd.bin)
          echo "### Zavádzač Odroid C4 – U-Boot ${UBOOT_TAG}: $v B, sha256 $(sha256sum uboot-vystup/u-boot.bin.sd.bin | cut -c1-16)…" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$v" -gt 65536 && test "$v" -le $((8192 * 512))
          x=uboot-vystup/x96/u-boot.ext
          echo "### X96 Max Plus – u-boot.ext $(stat -c %s $x) B, sha256 $(sha256sum $x | cut -c1-16)…" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -aq "SKLENIK x96-max-plus" "$x"
          grep -aq "amlogic/meson-sm1-x96-air-gbit.dtb" "$x"
          grep -aq "SKLENIK: hladam system na USB" "$x"
          grep -aq "extlinux/x96.conf" "$x"
      - uses: actions/upload-artifact@v4
        with:
          name: uboot-c4
          path: uboot-vystup

  jadro-allwinner:
    name: Jadro – Allwinner H618 (Tanix TX68; hlavné jadro Linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Pamäť zostaveného jadra
        id: pamat
        uses: actions/cache/restore@v4
        with:
          path: jadro-vystup
          key: jadro-h618-${{ env.ODROID_JADRO }}-${{ hashFiles('sklenik/jadro.config', 'sklenik/jadro-allwinner.config') }}
      - name: Jadro Linux z kernel.org + nastavenie ORCHIDEA OS pre Allwinner H618
        if: steps.pamat.outputs.cache-hit != 'true'
        run: |
          sh nastroje/balicky.sh bc bison flex libssl-dev make gcc xz-utils
          curl -sSfL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${ODROID_JADRO}.tar.xz" | tar xJ
          cd "linux-${ODROID_JADRO}"
          make -s defconfig
          # platformy iných výrobcov preč – zostane len Allwinner sunxi
          for a in $(grep -oE '^config ARCH_[A-Z0-9_]+' arch/arm64/Kconfig.platforms | cut -d' ' -f2); do
            [ "$a" = ARCH_SUNXI ] || scripts/config --disable "$a"
          done
          scripts/kconfig/merge_config.sh -m .config ../sklenik/jadro.config ../sklenik/jadro-allwinner.config
          make -s olddefconfig
          # popis hardvéru Transpeed 8K618-T – rovnaká doska H618 + AXP313 + DDR3 ako Tanix TX68
          make -s -j"$(nproc)" Image allwinner/sun50i-h618-transpeed-8k618-t.dtb
          mkdir -p ../jadro-vystup/allwinner/dtb/allwinner
          cp arch/arm64/boot/Image ../jadro-vystup/allwinner/
          cp arch/arm64/boot/dts/allwinner/sun50i-h618-transpeed-8k618-t.dtb ../jadro-vystup/allwinner/dtb/allwinner/
          cp .config ../jadro-vystup/allwinner/jadro-h618.config
          ls -lR ../jadro-vystup/allwinner
      - name: Uloženie zostaveného jadra do pamäte
        if: steps.pamat.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: jadro-vystup
          key: ${{ steps.pamat.outputs.cache-primary-key }}
      - name: Kontrola nastavenia jadra – ovládače H618 musia byť priamo v jadre
        run: |
          k=jadro-vystup/allwinner/jadro-h618.config
          {
            echo "### Jadro Allwinner H618 (Tanix TX68) – Linux ${ODROID_JADRO} ($(du -h jadro-vystup/allwinner/Image | cut -f1))"
            grep -qx "# CONFIG_MODULES is not set" "$k" && echo "- ✅ bez modulov (všetko v jadre)" || echo "- ❌ jadro má moduly"
            for riadok in $(grep -E '^CONFIG_[A-Z0-9_]+=y$' sklenik/jadro-allwinner.config); do
              if grep -qxF "$riadok" "$k"; then echo "- ✅ \`$riadok\`"; else echo "- ❌ \`$riadok\` chýba"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for riadok in $(grep -E '^CONFIG_[A-Z0-9_]+=y$' sklenik/jadro-allwinner.config); do grep -qxF "$riadok" "$k" || exit 1; done
          grep -qx "# CONFIG_MODULES is not set" "$k"
      - uses: actions/upload-artifact@v4
        with:
          name: allwinner-jadro
          path: jadro-vystup

  uboot-allwinner:
    name: Zavádzač Allwinner H618 (U-Boot + ARM Trusted Firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pamäť zostaveného zavádzača
        id: pamat
        uses: actions/cache/restore@v4
        with:
          path: uboot-vystup
          key: uboot-h618-${{ env.UBOOT_TAG }}-${{ env.TFA_TAG }}
      - name: ARM Trusted Firmware (BL31) a U-Boot (transpeed-8k618-t_defconfig)
        if: steps.pamat.outputs.cache-hit != 'true'
        run: |
          sh nastroje/balicky.sh build-essential bc bison flex libssl-dev libgnutls28-dev uuid-dev \
            python3-dev python3-setuptools python3-pyelftools swig gcc-aarch64-linux-gnu
          curl -sSfL "https://github.com/ARM-software/arm-trusted-firmware/archive/refs/tags/${TFA_TAG}.tar.gz" | tar xz
          curl -sSfL "https://github.com/u-boot/u-boot/archive/refs/tags/${UBOOT_TAG}.tar.gz" | tar xz
          cd "arm-trusted-firmware-${TFA_TAG#v}"
          make -s CROSS_COMPILE=aarch64-linux-gnu- PLAT=sun50i_h616 DEBUG=0 bl31
          bl31="$(pwd)/build/sun50i_h616/release/bl31.bin"
          cd "../u-boot-${UBOOT_TAG#v}"
          # Transpeed 8K618-T: H618, správca napájania AXP313, DDR3 – rovnaká doska ako Tanix TX68
          make -s CROSS_COMPILE=aarch64-linux-gnu- transpeed-8k618-t_defconfig
          scripts/config --set-str IDENT_STRING " SKLENIK tanix-tx68" --enable ENV_IS_NOWHERE \
            --disable ENV_IS_IN_MMC --disable ENV_IS_IN_FAT --set-val BOOTDELAY 1
          make -s CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          if grep -E '^CONFIG_ENV_IS_IN_[A-Z0-9_]+=y' .config; then echo "U-Boot by zapisoval nastavenie"; exit 1; fi
          make -s -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- BL31="$bl31" SCP=/dev/null
          mkdir -p ../uboot-vystup
          cp u-boot-sunxi-with-spl.bin ../uboot-vystup/
          ls -l ../uboot-vystup
      - name: Uloženie zostaveného zavádzača do pamäte
        if: steps.pamat.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: uboot-vystup
          key: ${{ steps.pamat.outputs.cache-primary-key }}
      - name: Kontrola – zavádzač sa zmestí pred oddiel karty (od 8 KiB do 4 MiB)
        run: |
          z=uboot-vystup/u-boot-sunxi-with-spl.bin
          v=$(stat -c %s $z)
          echo "### Zavádzač Tanix TX68 – U-Boot ${UBOOT_TAG} + TF-A ${TFA_TAG}: $v B, sha256 $(sha256sum $z | cut -c1-16)…" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$v" -gt 32768 && test "$v" -le $((8192 * 512 - 8192))
          grep -aq "SKLENIK tanix-tx68" $z
          grep -aq "allwinner/sun50i-h618-transpeed-8k618-t.dtb" $z
      - uses: actions/upload-artifact@v4
        with:
          name: allwinner-uboot
          path: uboot-vystup

  obraz-allwinner:
    name: Karta Allwinner (Tanix TX68) a skúška štartu jadra v QEMU
    needs: [jadro-allwinner, uboot-allwinner, klic]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Nástroje
        run: sh nastroje/balicky.sh dosfstools mtools fdisk qemu-system-arm device-tree-compiler
      - uses: actions/download-artifact@v4
        with:
          name: allwinner-jadro
          path: jadra
      - uses: actions/download-artifact@v4
        with:
          name: allwinner-uboot
          path: uboot
      - uses: actions/download-artifact@v4
        with:
          name: klic-v8
          path: klic
      - name: Zavádzací oddiel – jadro, systém v pamäti, nastavenie
        run: |
          mkdir -p boot/allwinner boot/extlinux
          python3 nastroje/initramfs.py klic/klic boot/initramfs8.cpio.gz
          cp jadra/allwinner/Image jadra/allwinner/jadro-h618.config boot/allwinner/
          cp -r jadra/allwinner/dtb boot/
          cp sklenik/boot/allwinner/extlinux.conf boot/extlinux/
          cp sklenik/boot/sklenik.txt boot/
          # R118: popis Transpeed 8K618-T upravený pre Tanix TX68 – meno, všetky štyri radiče USB (TX68 má zásuvky
          # aj na druhom páre), Wi-Fi (mmc@4021000) bez napájania – zatiaľ ju nepodporujeme (R112)
          f=boot/dtb/allwinner/sun50i-h618-transpeed-8k618-t.dtb
          fdtput -t s "$f" / model "Tanix TX68"
          for u in usb@5310000 usb@5310400 usb@5311000 usb@5311400; do fdtput -t s "$f" "/soc/$u" status okay; done
          fdtput -t s "$f" /soc/mmc@4021000 status disabled
          echo "$f: $(fdtget "$f" / model)"
          printf 'ORCHIDEA OS %s – karta pre Tanix TX68 (Allwinner H618)\njadro: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-%s.tar.xz + sklenik/jadro.config + sklenik/jadro-allwinner.config (allwinner/jadro-h618.config)\nzavádzač (od 8 KiB, pred oddielom): https://github.com/u-boot/u-boot/tree/%s (GPL-2.0+, transpeed-8k618-t_defconfig) + https://github.com/ARM-software/arm-trusted-firmware/tree/%s (BSD-3-Clause, BL31)\nKLÍČ a ORCHIDEA: https://github.com/tarzanislav/orchidea\n' \
            "$GITHUB_SHA" "$ODROID_JADRO" "$UBOOT_TAG" "$TFA_TAG" > boot/ZDROJE.txt
          ls -lR boot | head -40
      - name: Obraz karty
        run: |
          mkdir -p obraz
          mkfs.vfat -F 32 -n SKLENIK -C obraz/boot.img 262144 > /dev/null
          mcopy -s -i obraz/boot.img boot/* ::
          truncate -s 260M obraz/sklenik-allwinner.img
          printf 'label: dos\nstart=8192, type=c, bootable\n' | sfdisk -q obraz/sklenik-allwinner.img
          dd if=obraz/boot.img of=obraz/sklenik-allwinner.img bs=512 seek=8192 conv=notrunc status=none
          rm obraz/boot.img
          # zavádzač od 8 KiB (sektor 16) – tam ho hľadá zavádzací kód čipu Allwinner; tabuľka oddielov ostane
          dd if=uboot/u-boot-sunxi-with-spl.bin of=obraz/sklenik-allwinner.img bs=1024 seek=8 conv=notrunc status=none
          sfdisk -l obraz/sklenik-allwinner.img
      - name: Kontrola – Tanix TX68 (zavádzač, tabuľka oddielov, jadro, popis hardvéru)
        run: |
          echo "### Tanix TX68" >> "$GITHUB_STEP_SUMMARY"
          python3 nastroje/kontrola_allwinner.py obraz/sklenik-allwinner.img uboot/u-boot-sunxi-with-spl.bin boot | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Skúška štartu jadra a KLÍČA v QEMU (procesor Cortex-A53 ako H618)
        run: |
          # Tanix TX68 QEMU nemá – jadro a systém sa skúšajú na všeobecnom stroji bez obrazovky (ako TX68 dnes)
          qemu-system-aarch64 -M virt,gic-version=2 -cpu cortex-a53 -m 1G -kernel boot/allwinner/Image \
            -initrd boot/initramfs8.cpio.gz -nographic -no-reboot \
            -append "earlycon=pl011,0x9000000 console=ttyAMA0 rdinit=/init sklenik.skuska=1 loglevel=7" > qemu-h618.log 2>&1 &
          q=$!
          for i in $(seq 1 120); do grep -q "ORCHIDEA OS pripravený" qemu-h618.log && break; kill -0 $q 2>/dev/null || break; sleep 2; done
          kill $q 2>/dev/null || true
          echo "#### Jadro Allwinner H618 na procesore Cortex-A53 (nie celý TX68)" >> "$GITHUB_STEP_SUMMARY"
          grep "KLÍČ" qemu-h618.log | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "ORCHIDEA OS pripravený" qemu-h618.log || { tail -40 qemu-h618.log; exit 1; }
          grep -q "KLÍČ: test pamäte: .* v poriadku" qemu-h618.log && echo "✅ $(grep -o 'KLÍČ: test pamäte: .*' qemu-h618.log | head -1)" | tee -a "$GITHUB_STEP_SUMMARY" || { echo "❌ test pamäte"; exit 1; }
          if grep -q "KLÍČ: bez obrazovky – stav na kontrolkách klávesnice" qemu-h618.log; then
            echo "✅ bez obrazovky hovorí ORCHIDEA OS kontrolkami klávesnice (R119)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ slepý režim sa nezapol" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sklenik-allwinner
          path: |
            obraz/sklenik-allwinner.img
            qemu-h618.log
          if-no-files-found: warn

  obraz:
    name: Univerzálna karta a skúšky štartu v QEMU
    needs: [jadro, jadro-odroid, uboot-odroid, klic]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Nástroje
        run: |
          sh nastroje/balicky.sh dosfstools mtools fdisk qemu-system-arm device-tree-compiler
      - uses: actions/download-artifact@v4
        with:
          pattern: jadro-*
          path: jadra
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: klic-*
          path: klic
      - uses: actions/download-artifact@v4
        with:
          name: uboot-c4
          path: uboot
      - name: Firmvér Raspberry Pi
        run: |
          mkdir -p firmver
          for f in bootcode.bin start.elf fixup.dat start4.elf fixup4.dat LICENCE.broadcom; do
            curl -sSfL -o "firmver/$f" "https://raw.githubusercontent.com/raspberrypi/firmware/${FIRMVER_TAG}/boot/$f"
          done
          # prekrytia popisu hardvéru, ktoré používa config.txt (len tie, nie celý priečinok)
          mkdir -p prekrytia
          for f in $(cat sklenik/boot/config.txt sklenik/boot/sklenik-obraz.txt | grep -oE '^dtoverlay=[a-z0-9-]+' | cut -d= -f2 | sort -u); do
            curl -sSfL -o "prekrytia/$f.dtbo" "https://raw.githubusercontent.com/raspberrypi/firmware/${FIRMVER_TAG}/boot/overlays/$f.dtbo"
          done
          ls -l prekrytia
      - name: Zavádzací oddiel – jadrá, systémy v pamäti, nastavenie
        run: |
          mkdir -p boot
          # R223: v systéme v pamäti aj program merania HEVC a skúšobné toky (z úlohy v8)
          for v in 6 7 8; do
            dalsie="usr/bin/hevc_meranie=klic/klic-v$v/hevc_meranie"
            for t in klic/klic-v8/hevc/*.hevc; do dalsie="$dalsie usr/share/orchidea/hevc/$(basename "$t")=$t"; done
            python3 nastroje/initramfs.py "klic/klic-v$v/klic" "boot/initramfs$v.cpio.gz" $dalsie
          done
          cp firmver/* jadra/*.dtb jadra/*.img jadra/*.config boot/
          cp sklenik/boot/config.txt sklenik/boot/cmdline.txt sklenik/boot/sklenik.txt sklenik/boot/sklenik-obraz.txt sklenik/boot/sklenik-pokoj.txt boot/
          mkdir -p boot/overlays && cp prekrytia/*.dtbo boot/overlays/
          # Amlogic S905X3 (Odroid C4, X96 Max Plus): spoločné jadro v amlogic/, popisy hardvéru v dtb/amlogic/
          # (U-Boot si vyberie podľa svojho fdtfile), nastavenie zavádzača U-Boot v extlinux/
          mkdir -p boot/amlogic boot/dtb
          cp jadra/amlogic/Image jadra/amlogic/jadro-s905x3.config boot/amlogic/
          # R174: firmvér dekodéra videa a jeho licencia (samostatné súbory, KLÍČ ich dá do /lib/firmware)
          mkdir -p boot/amlogic/vdec && cp jadra/amlogic/vdec/* boot/amlogic/vdec/
          cp -r jadra/amlogic/dtb/amlogic boot/dtb/
          cp -r sklenik/boot/extlinux boot/
          # R96: Odroid C4 – rýchle režimy SD (UHS) preč z popisu hardvéru, aby fungoval reštart zo SD karty
          # (karta by ostala v režime 1,8 V a zavádzač ju po reštarte neprečíta); systém beží z pamäte, takže
          # pomalšia karta po štarte takmer nevadí. eMMC (mmc@ffe07000) zostáva v plnej rýchlosti.
          for v in sd-uhs-sdr12 sd-uhs-sdr25 sd-uhs-sdr50 sd-uhs-sdr104; do
            fdtput -d boot/dtb/amlogic/meson-sm1-odroid-c4.dtb /soc/mmc@ffe05000 "$v"
          done
          # R238: Odroid C4 – karta SD najviac 25 MHz. Merania 24. a 26. 11. (dve karty, studený aj teplý štart): pri
          # 50 MHz chyby CRC (-84) pri inicializácii aj čítaní – po reštarte strážnym časovačom (teplý čip) sa karta
          # 9 s nedala spustiť; pri 25 MHz 2 h bez jedinej chyby. Príčina je časovanie signálu radiča SD, nie karta
          # (tá istá karta na RPi 3 B+ pri 50 MHz bez chyby) – vlastné nastavenie fáz taktu je ďalší krok výskumu.
          # Pri ďalších chybách KLÍČ znižuje ďalej (R235: 12,5 MHz).
          f=boot/dtb/amlogic/meson-sm1-odroid-c4.dtb
          fdtput -t u "$f" /soc/mmc@ffe05000 max-frequency 25000000
          echo "$f: karta SD najviac $(fdtget "$f" /soc/mmc@ffe05000 max-frequency) Hz (R238)"
          # R240: karta SD nevymeniteľná – ovládač pinov Amlogic nevie z GPIO prerušenie (chýba to_irq), preto
          # jadro kartu skúšalo každú sekundu (CMD13, radič 1,1 budenia/s). Odroid 27. 11. na TV: v reproduktoroch
          # „dvakrát rýchlo každú sekundu“; X96 (radič odpojený) ticho. Karta je zavádzací nosič – za behu sa
          # nevyberá; KLÍČ pri zlyhaní spustenia skúsi radič znova (R189).
          fdtput -d "$f" /soc/mmc@ffe05000 cd-gpios
          fdtput "$f" /soc/mmc@ffe05000 non-removable
          fdtget "$f" /soc/mmc@ffe05000 non-removable >/dev/null && echo "$f: karta SD nevymeniteľná (R240)"
          # R117: X96 Max Plus – popis referenčnej dosky krabičiek S905X3 (X96 Air) s menom krabičky; Wi-Fi
          # (mmc@ffe03000) bez napájania – zatiaľ ju nepodporujeme a v plastovej krabičke by len hriala (R112)
          for d in meson-sm1-x96-air-gbit:"Amediatech X96 Max Plus" meson-sm1-x96-air:"Amediatech X96 Max Plus (Ethernet 100 Mb/s)"; do
            f="boot/dtb/amlogic/${d%%:*}.dtb"
            fdtput -t s "$f" / model "${d#*:}"
            fdtput -t s "$f" /soc/mmc@ffe03000 status disabled
            echo "$f: $(fdtget "$f" / model) – Wi-Fi $(fdtget "$f" /soc/mmc@ffe03000 status)"
          done
          # R161: X96 Max Plus – nepoužívané časti čipu vypnuté: grafický procesor Mali (obraz skladajú roviny
          # obvodu obrazu VPU, GPU netreba; bez napájania v popise hlásil chybu) a USB OTG dwc2 (krabička nikdy
          # nie je USB zariadením – oba porty natrvalo ako hostiteľ, bez pokusu o g_mass_storage)
          # R188: Odroid C4 (ten istý čip S905X3) dostáva tie isté chladné úpravy ako X96 Max Plus
          for d in meson-sm1-x96-air-gbit meson-sm1-x96-air meson-sm1-odroid-c4; do
            f="boot/dtb/amlogic/$d.dtb"
            fdtput -t s "$f" /soc/gpu@ffe40000 status disabled
            fdtput -t s "$f" /soc/usb@ffe09000/usb@ff400000 status disabled
            fdtput -t s "$f" /soc/usb@ffe09000 dr_mode host
            echo "$f: GPU $(fdtget "$f" /soc/gpu@ffe40000 status), USB OTG $(fdtget "$f" /soc/usb@ffe09000/usb@ff400000 status), USB $(fdtget "$f" /soc/usb@ffe09000 dr_mode)"
            # R166: vlastný ovládač taktu VPU – takty z hlavného ovládača taktov (ID podľa dt-bindings g12a-clkc.h:
            # VPU 116, VPU_0 112, VPU_1 115, VPU_0_SEL 110, VPU_1_SEL 113, FCLK_DIV3 3, FCLK_DIV4 4, FCLK_DIV5 5).
            # R182: televízor bez signálu 23. 11. spôsobilo vypnuté CEC (R180), nie tento uzol; KLÍČ takt mimo pokusu
            # mení len pri vypnutom obraze.
            ph=$(fdtget -t u "$f" /soc/bus@ff600000/bus@3c000/system-controller@0/clock-controller phandle)
            fdtput -c "$f" /sklenik-vpu
            fdtput -t s "$f" /sklenik-vpu compatible sklenik,vpu-takt
            fdtput -t u "$f" /sklenik-vpu clocks $ph 116 $ph 112 $ph 115 $ph 110 $ph 113 $ph 3 $ph 4 $ph 5
            fdtput -t s "$f" /sklenik-vpu clock-names vpu vpu_0 vpu_1 vpu_0_sel vpu_1_sel fclk_div3 fclk_div4 fclk_div5
            echo "$f: takt VPU – $(fdtget "$f" /sklenik-vpu compatible), takty $(fdtget "$f" /sklenik-vpu clock-names)"
            # R186: spoločný časovač budenia – Timer F (riadenie ISA_TIMER_MUX1 0xffd0f190, hodnota 0xffd0f194),
            # prerušenie GIC SPI 60 hrana (ako v Androide výrobcu); hlavné jadro tieto časovače nepoužíva
            c=/soc/bus@ffd00000/sklenik-casovac@f190
            fdtput -c "$f" "$c"
            fdtput -t s "$f" "$c" compatible sklenik,casovac-budenia
            fdtput -t x "$f" "$c" reg 0 f190 0 8
            fdtput -t u "$f" "$c" interrupts 0 60 1
            echo "$f: časovač budenia – $(fdtget "$f" "$c" compatible), reg $(fdtget -t x "$f" "$c" reg), prerušenie $(fdtget "$f" "$c" interrupts)"
            # R168: jadro sa na teplotu pýta raz za 5 s namiesto každú sekundu (menej prebudení čipu); nad hranicou
            # pasívneho chladenia ostáva 100 ms – bezpečnosť sa nemení (čas ohrevu čipu je v minútach)
            for z in cpu-thermal ddr-thermal; do
              fdtput -t i "$f" "/thermal-zones/$z" polling-delay 5000
            done
            echo "$f: teplota každých $(fdtget "$f" /thermal-zones/cpu-thermal polling-delay) ms (CPU) a $(fdtget "$f" /thermal-zones/ddr-thermal polling-delay) ms (DDR), pri ohreve $(fdtget "$f" /thermal-zones/cpu-thermal polling-delay-passive) ms"
            # R216: záznamník pádov – 1 MiB pamäte na 1008 MiB (nad jadrom 0x08080000 a systémom v pamäti od
            # 0x13000000, pod zavádzačom na konci pamäte; dosky majú 2 až 4 GiB): hlásenia jadra pri páde 128 KiB,
            # konzola jadra 256 KiB, riadky KLÍČA (/dev/pmsg0) 256 KiB
            r=/reserved-memory/ramoops@3f000000
            fdtput -c "$f" "$r"
            fdtput -t s "$f" "$r" compatible ramoops
            fdtput -t x "$f" "$r" reg 0 3f000000 0 100000
            fdtput -t x "$f" "$r" record-size 20000
            fdtput -t x "$f" "$r" console-size 40000
            fdtput -t x "$f" "$r" pmsg-size 40000
            echo "$f: záznamník pádov – $(fdtget "$f" "$r" compatible), reg $(fdtget -t x "$f" "$r" reg)"
          done
          # X96 Max Plus – gigabitový čip siete býva iný ako v referenčnej doske (iná adresa, iný výrobca):
          # reset čipu presunutý na zbernicu MDIO (čip sa prebudí PRED hľadaním), bez pevnej adresy (jadro ho
          # hľadá na všetkých 32 adresách) a bez prerušenia (môže byť zapojené inak – jadro sa pýta samo)
          f=boot/dtb/amlogic/meson-sm1-x96-air-gbit.dtb
          m=/soc/bus@ff600000/mdio-multiplexer@4c000/mdio@0
          c=$m/ethernet-phy@0
          rg=$(fdtget -t x "$f" "$c" reset-gpios)
          fdtput -t x "$f" "$m" reset-gpios $rg
          fdtput -t i "$f" "$m" reset-delay-us 10000
          fdtput -t i "$f" "$m" reset-post-delay-us 80000
          for v in reg reset-gpios reset-assert-us reset-deassert-us interrupts interrupt-parent; do
            fdtput -d "$f" "$c" "$v" 2>/dev/null || true
          done
          echo "$f: reset MDIO $(fdtget -t x "$f" "$m" reset-gpios), čip bez adresy: $(fdtget "$f" "$c" reg 2>&1 | head -1)"
          # pôvodný zavádzač krabičky hľadá skripty a u-boot.ext v koreni karty
          cp uboot/x96/aml_autoscript uboot/x96/s905_autoscript uboot/x96/u-boot.ext boot/
          printf 'ORCHIDEA OS %s – univerzálna karta pre Raspberry Pi 1, 2, 3, 4, 5, Zero, Zero W, Zero 2 W, Odroid C4 a X96 Max Plus\njadro: https://github.com/raspberrypi/linux/tree/%s + sklenik/jadro.config (úplné nastavenie v jadro-*.config)\nfirmvér: https://github.com/raspberrypi/firmware/tree/%s/boot (LICENCE.broadcom)\nAmlogic S905X3 (Odroid C4, X96 Max Plus) – jadro: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-%s.tar.xz + sklenik/jadro.config + sklenik/jadro-odroid.config (amlogic/jadro-s905x3.config)\nfirmvér dekodéra videa (amlogic/vdec/, samostatne – nie v jadre): https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/tree/meson/vdec (licencia amlogic/vdec/licencia.txt)\nOdroid C4 – zavádzač (prvé 4 MiB karty): https://github.com/u-boot/u-boot/tree/%s (GPL-2.0+) a podpísané časti Amlogic https://github.com/LibreELEC/amlogic-boot-fip/tree/%s/odroid-c4\nX96 Max Plus – u-boot.ext: https://github.com/u-boot/u-boot/tree/%s (GPL-2.0+, bananapi-m5_defconfig + popis X96 Air), skripty sklenik/boot/amlogic/\nKLÍČ a ORCHIDEA: https://github.com/tarzanislav/orchidea\n' \
            "$GITHUB_SHA" "$JADRO_TAG" "$FIRMVER_TAG" "$ODROID_JADRO" "$UBOOT_TAG" "$FIP_COMMIT" "$UBOOT_TAG" > boot/ZDROJE.txt
          ls -l boot
          du -sh boot
      - name: Kontrola – každý model dostane svoje jadro a svoj systém
        run: |
          echo "### Univerzálna karta – výber podľa modelu" >> "$GITHUB_STEP_SUMMARY"
          python3 nastroje/kontrola_karty.py boot | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Obraz karty
        run: |
          mkdir -p obraz
          mkfs.vfat -F 32 -n SKLENIK -C obraz/boot.img 262144 > /dev/null
          mcopy -s -i obraz/boot.img boot/* ::
          # oddiel začína na 4 MiB – miesto pred ním zostane voľné (zavádzače iných dosiek, napr. Odroid)
          truncate -s 260M obraz/sklenik-rpi.img
          printf 'label: dos\nstart=8192, type=c, bootable\n' | sfdisk -q obraz/sklenik-rpi.img
          dd if=obraz/boot.img of=obraz/sklenik-rpi.img bs=512 seek=8192 conv=notrunc status=none
          rm obraz/boot.img
          # zavádzač Odroidu C4 do voľného miesta pred oddielom: od 2. sektora a začiatok 1. sektora
          # (prvých 440 bajtov) – tabuľka oddielov zostane nedotknutá, Raspberry Pi si to nevšimne
          z=uboot/u-boot.bin.sd.bin
          dd if="$z" of=obraz/sklenik-rpi.img conv=notrunc bs=512 skip=1 seek=1 status=none
          dd if="$z" of=obraz/sklenik-rpi.img conv=notrunc bs=1 count=440 status=none
          sfdisk -l obraz/sklenik-rpi.img
      - name: Kontrola – Odroid C4 a X96 Max Plus (zavádzače, tabuľka oddielov, jadro, popisy hardvéru, skripty)
        run: |
          echo "### Odroid C4 a X96 Max Plus" >> "$GITHUB_STEP_SUMMARY"
          python3 nastroje/kontrola_odroid.py obraz/sklenik-rpi.img uboot/u-boot.bin.sd.bin boot | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Karta s nastavením od ORCHIDEA Zapisovača (meno a jazyk) pre skúšku
        run: |
          rustup toolchain install
          cargo build --locked --release -p sklenik-sadic
          cp obraz/sklenik-rpi.img karta.img
          target/release/sadic priprav karta.img meno=skuska-qemu jazyk=sk
          # QEMU chce kartu s veľkosťou mocniny dvoch
          truncate -s 512M karta.img
      - name: Skúšky štartu v emulovaných Raspberry Pi (QEMU)
        run: |
          skusaj() {
            meno="$1"; log="$2"; sock="$3"; shift 3
            "$@" -nographic -no-reboot -monitor "unix:$sock,server,nowait" > "$log" 2>&1 &
            q=$!
            for i in $(seq 1 150); do
              grep -q "ORCHIDEA OS pripravený" "$log" && break
              kill -0 $q 2>/dev/null || break
              sleep 2
            done
            echo "#### $meno" >> "$GITHUB_STEP_SUMMARY"
            if grep -q "ORCHIDEA OS pripravený" "$log"; then
              grep "KLÍČ" "$log" | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
              rozmer=$(grep -o "obrazovka: [0-9]*×[0-9]*" "$log" | head -1 | grep -o "[0-9]*×[0-9]*" || true)
              if [ -n "$rozmer" ]; then
                if ! python3 nastroje/kontrola_obrazovky.py "$sock" "${rozmer%×*}" "${rozmer#*×}" | tee -a "$GITHUB_STEP_SUMMARY"; then
                  kill $q 2>/dev/null || true; echo "❌ $meno – obrazovka"; return 1
                fi
              else
                echo "❌ $meno – KLÍČ nenašiel grafickú obrazovku" | tee -a "$GITHUB_STEP_SUMMARY"; kill $q 2>/dev/null || true; return 1
              fi
              kill $q 2>/dev/null || true
              echo "✅ $meno"; return 0
            fi
            kill $q 2>/dev/null || true
            echo "❌ nenaštartoval" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ $meno"; head -60 "$log"; echo "…"
            grep -E -A6 "Unable to handle|Internal error|PC is at|Kernel panic|Run /init" "$log" | head -60; echo "…"
            tail -30 "$log"; return 1
          }
          spolocne="rdinit=/init sklenik.skuska=1 loglevel=7"
          chyby=0
          skusaj "Raspberry Pi 3 (64-bit) s kartou" qemu-rpi3.log qm-rpi3.sock qemu-system-aarch64 -M raspi3b -m 1G \
            -kernel boot/kernel8.img -dtb boot/bcm2710-rpi-3-b.dtb -initrd boot/initramfs8.cpio.gz \
            -drive if=sd,format=raw,file=karta.img \
            -append "earlycon=pl011,mmio32,0x3f201000 console=ttyAMA0,115200 $spolocne" || chyby=$((chyby+1))
          if grep -q "nastavenie z /dev/mmcblk0: meno skuska-qemu, jazyk sk" qemu-rpi3.log; then
            echo "✅ KLÍČ prečítal z karty nastavenie od ORCHIDEA Zapisovača (meno, jazyk)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ KLÍČ neprečítal nastavenie z karty" | tee -a "$GITHUB_STEP_SUMMARY"; grep -iE "mmc|nastavenie" qemu-rpi3.log | head -20; chyby=$((chyby+1))
          fi
          # Profil hardvéru (PÔDA, R92) a stlačená pamäť zram (R94, RPi 3 má 1 GB)
          if grep -q "KLÍČ: Profil hardvéru (PÔDA) – .*čip BCM2837" qemu-rpi3.log; then
            echo "✅ $(grep -o 'KLÍČ: Profil hardvéru (PÔDA) – .*' qemu-rpi3.log | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ KLÍČ neprečítal profil hardvéru (PÔDA)" | tee -a "$GITHUB_STEP_SUMMARY"; grep -i "pôda" qemu-rpi3.log | head; chyby=$((chyby+1))
          fi
          # strážca pravdy (R100) a strážny časovač (R99)
          if grep -q "KLÍČ: test jadier: 4/4 v poriadku" qemu-rpi3.log; then
            echo "✅ $(grep -o 'KLÍČ: test jadier: .*' qemu-rpi3.log | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ test jadier neprešiel" | tee -a "$GITHUB_STEP_SUMMARY"; grep -i "jadi\|jadro" qemu-rpi3.log | head; chyby=$((chyby+1))
          fi
          if grep -q "KLÍČ: zram: " qemu-rpi3.log; then
            echo "✅ $(grep -o 'KLÍČ: zram: .*' qemu-rpi3.log | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ KLÍČ nezapol zram" | tee -a "$GITHUB_STEP_SUMMARY"; grep -i "zram" qemu-rpi3.log | head; chyby=$((chyby+1))
          fi
          if grep -q "KLÍČ: test pamäte: .* v poriadku" qemu-rpi3.log; then
            echo "✅ $(grep -o 'KLÍČ: test pamäte: .*' qemu-rpi3.log | head -1) (R120)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ test pamäte neprešiel" | tee -a "$GITHUB_STEP_SUMMARY"; grep -i "pamäte" qemu-rpi3.log | head; chyby=$((chyby+1))
          fi
          if grep -q "KLÍČ: udalosti jadra: sledované" qemu-rpi3.log; then
            echo "✅ KLÍČ čaká na udalosti jadra (R113)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ KLÍČ nesleduje udalosti jadra" | tee -a "$GITHUB_STEP_SUMMARY"; grep -i "udalosti" qemu-rpi3.log | head; chyby=$((chyby+1))
          fi
          # R122: samomeranie – KLÍČ zapísal záznam 0. minúty na kartu emulátora; priečinok MERANIA sa skopíruje
          # z oddielu FAT (od 4 MiB) a správa aj snímka PNG sa overia nezávisle (obrázok sa neuchováva)
          if grep -q "KLÍČ: samomeranie: záznam 0. minúty zapísaný na SD karta (mmcblk0p1)" qemu-rpi3.log; then
            echo "✅ $(grep -o 'KLÍČ: samomeranie: záznam 0. minúty zapísaný.*' qemu-rpi3.log | head -1) (R122)" | tee -a "$GITHUB_STEP_SUMMARY"
            rozmer=$(grep -o "obrazovka: [0-9]*×[0-9]*" qemu-rpi3.log | head -1 | grep -o "[0-9]*×[0-9]*")
            rm -rf meranie
            # výsledok kontroly sa berie z Pythonu, nie z tee (bez pipefail by chyba prešla)
            if MTOOLS_SKIP_CHECK=1 mcopy -s -i karta.img@@4194304 ::MERANIA meranie \
              && python3 nastroje/kontrola_merania.py meranie "${rozmer%×*}" "${rozmer#*×}" > kontrola-merania.txt; then
              tee -a "$GITHUB_STEP_SUMMARY" < kontrola-merania.txt
            else
              tee -a "$GITHUB_STEP_SUMMARY" < kontrola-merania.txt 2>/dev/null || true
              echo "❌ samomeranie – súbory na karte nie sú v poriadku" | tee -a "$GITHUB_STEP_SUMMARY"; chyby=$((chyby+1))
            fi
            rm -rf meranie
          else
            echo "❌ samomeranie nezapísalo záznam na kartu" | tee -a "$GITHUB_STEP_SUMMARY"; grep -i "samomeranie" qemu-rpi3.log | head; chyby=$((chyby+1))
          fi
          if grep -q "KLÍČ: karta mmcblk0: čítanie" qemu-rpi3.log; then
            echo "✅ KLÍČ zmeral rýchlosť karty: $(grep -o 'karta mmcblk0: čítanie.*' qemu-rpi3.log | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ KLÍČ nezmeral rýchlosť karty" | tee -a "$GITHUB_STEP_SUMMARY"; grep -iE "meri|meranie|mmc" qemu-rpi3.log | tail -20; chyby=$((chyby+1))
          fi
          skusaj "Raspberry Pi 2 (ARMv7)" qemu-rpi2.log qm-rpi2.sock qemu-system-arm -M raspi2b -m 1G \
            -kernel boot/kernel7.img -dtb boot/bcm2709-rpi-2-b.dtb -initrd boot/initramfs7.cpio.gz \
            -append "earlycon=pl011,mmio32,0x3f201000 console=ttyAMA0,115200 $spolocne" || chyby=$((chyby+1))
          # QEMU nenapodobňuje blok správy napájania BCM2835 (jeho ovládač by v emulátore spadol) – len pre
          # emulátor sa v popise hardvéru vypne; na karte zostáva popis bez zmeny
          cp boot/bcm2708-rpi-zero.dtb qemu-zero.dtb
          pm=$(fdtget -l qemu-zero.dtb /soc | grep -m1 '^watchdog@' || true)
          if [ -n "$pm" ]; then fdtput -t s qemu-zero.dtb "/soc/$pm" status disabled; echo "emulátor: /soc/$pm vypnutý"; fi
          skusaj "Raspberry Pi Zero (ARMv6)" qemu-rpi0.log qm-rpi0.sock qemu-system-arm -M raspi0 -m 512M \
            -kernel boot/kernel.img -dtb qemu-zero.dtb -initrd boot/initramfs6.cpio.gz \
            -append "earlycon=pl011,mmio32,0x20201000 console=ttyAMA0,115200 $spolocne" || chyby=$((chyby+1))
          # RPi 5 QEMU nemá – jadro pre RPi 5 sa skúša aspoň na všeobecnom stroji s procesorom Cortex-A76
          # (všeobecný stroj nemá obrazovku – kontroluje sa len štart jadra a KLÍČA)
          skusaj_bez_obrazovky() {
            meno="$1"; log="$2"; shift 2
            "$@" -nographic -no-reboot > "$log" 2>&1 &
            q=$!
            for i in $(seq 1 150); do
              grep -q "ORCHIDEA OS pripravený" "$log" && break
              kill -0 $q 2>/dev/null || break
              sleep 2
            done
            kill $q 2>/dev/null || true
            echo "#### $meno" >> "$GITHUB_STEP_SUMMARY"
            grep -q "ORCHIDEA OS pripravený" "$log" && { grep "KLÍČ" "$log" | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"; echo "✅ $meno"; return 0; }
            tail -30 "$log"; return 1
          }
          skusaj_bez_obrazovky "Jadro RPi 5 na procesore Cortex-A76 (nie celé RPi 5)" qemu-rpi5.log qemu-system-aarch64 \
            -M virt,gic-version=2 -cpu cortex-a76 -m 1G -kernel boot/kernel_2712.img -initrd boot/initramfs8.cpio.gz \
            -append "earlycon=pl011,0x9000000 console=ttyAMA0 $spolocne" \
            || echo "⚠️ jadro RPi 5 na všeobecnom stroji nenaštartovalo – overí sa na skutočnom RPi 5" | tee -a "$GITHUB_STEP_SUMMARY"
          # Odroid C4 ani X96 QEMU nemá – ich spoločné jadro a systém sa skúšajú na všeobecnom stroji s procesorom
          # Cortex-A55 (ako S905X3); zavádzače a ovládače dosiek sa overia až na skutočných zariadeniach
          skusaj_bez_obrazovky "Jadro Amlogic S905X3 na procesore Cortex-A55 (nie celý Odroid ani X96)" qemu-odroid.log qemu-system-aarch64 \
            -M virt,gic-version=2 -cpu cortex-a55 -m 1G -kernel boot/amlogic/Image -initrd boot/initramfs8.cpio.gz \
            -append "earlycon=pl011,0x9000000 console=ttyAMA0 $spolocne" || chyby=$((chyby+1))
          test $chyby -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sklenik-rpi
          path: |
            obraz/sklenik-rpi.img
            qemu-*.log
          if-no-files-found: warn
