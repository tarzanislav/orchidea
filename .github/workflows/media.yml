name: Médiá – kontajnery, FLAC, rozhodca a dlhý fuzzer (LÝRA)

# Prúd D (médiá): beží len pri zmene balíka media a toho, od čoho závisí – ostatné prúdy nebrzdí.
# - rozhodca: FFmpeg a mkvmerge zapíšu skúšobné súbory, ffprobe vypíše pakety; naša čítačka musí dať
#   bit po bite tie isté pakety (čas, kľúčovosť, veľkosť, MD5 obsahu),
# - FLAC: MD5 dekódovania sa rovná MD5 v STREAMINFO (sada IETF CELLAR, kodéry flac a FFmpeg),
# - dlhý fuzzer čítačiek a dekodérov (R211) s viacerými semienkami.
on:
  push:
    paths:
      - "media/**"
      - "jadro/**"
      - "zariadenie/**"
      - "hevc/src/odtlacok.rs"
      - "Cargo.lock"
      - ".github/workflows/media.yml"
  pull_request:
    paths:
      - "media/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rozhodca:
    name: Médiá – kontajnery proti rozhodcovi (FFmpeg, ffprobe, mkvmerge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Rozhodcovia (FFmpeg, MKVToolNix)
        run: sh nastroje/balicky.sh ffmpeg mkvtoolnix python3-numpy
      - name: Zostavenie
        run: cargo build --locked --release -p orchidea-media --example media_pakety --example media_hdmi --example media_opus
      - name: Porovnanie paketov s rozhodcom
        shell: bash
        run: |
          echo "### Médiá – kontajnery proti rozhodcovi" >> "$GITHUB_STEP_SUMMARY"
          python3 media/nastroje/over_media.py target/release/examples/media_pakety "$RUNNER_TEMP/media" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Opus (L7) – bitovo presné entropické dekódovanie a rekonštrukcia proti libopus
        shell: bash
        run: |
          echo "### Médiá – dekodér Opus proti libopus" >> "$GITHUB_STEP_SUMMARY"
          python3 media/nastroje/over_opus.py target/release/examples/media_opus "$RUNNER_TEMP/opus" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Skúšobné toky ISO/IEC 11172-4 pre vrstvu III (sada FATE – len údaje, bez kódu)
        shell: bash
        run: |
          d="$RUNNER_TEMP/mp3-iso"; mkdir -p "$d"
          rsync -a --include='*.bit' --include='*.pcm' --exclude='*' \
            rsync://fate-suite.ffmpeg.org/fate-suite/mp3-conformance/ "$d/" || {
            u=https://fate-suite.ffmpeg.org/mp3-conformance/
            for f in $(curl -fsSL "$u" | grep -o 'href="[^"/]*\.\(bit\|pcm\)"' | sed 's/^href="//;s/"$//'); do
              curl -fsSL "$u$f" -o "$d/$f"
            done
          }
          ls -l "$d"
      - name: MPEG audio (L8) – vrstva III, spotreba bitov a presnosť ISO/IEC 11172-4 (LAME, Shine, toky ISO)
        shell: bash
        run: |
          cargo build --release -p orchidea-media --example media_mpa
          echo "### Médiá – MPEG audio vrstva III (spotreba bitov, presnosť 11172-4)" >> "$GITHUB_STEP_SUMMARY"
          python3 media/nastroje/over_mpa.py target/release/examples/media_mpa "$RUNNER_TEMP/mpa" "$RUNNER_TEMP/mp3-iso" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pakety Opus pri neúspechu (na rozbor)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opus-pakety
          path: ${{ runner.temp }}/opus/*.opuspak
          retention-days: 7
      - name: Opus (L7) – skúšobné vektory RFC 8251 (konečný stav pri každom pakete)
        shell: bash
        run: |
          echo "### Médiá – Opus, skúšobné vektory RFC 8251" >> "$GITHUB_STEP_SUMMARY"
          python3 media/nastroje/over_vektory.py target/release/examples/media_opus "$RUNNER_TEMP/vektory" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Zvuk pre HDMI (R5b) – priechod IEC 61937 a PCM v poradí CTA-861
        shell: bash
        run: |
          echo "### Médiá – zvuk pre HDMI proti rozhodcovi" >> "$GITHUB_STEP_SUMMARY"
          python3 media/nastroje/over_hdmi.py target/release/examples/media_hdmi "$RUNNER_TEMP/hdmi" | tee -a "$GITHUB_STEP_SUMMARY"

  flac:
    name: Médiá – FLAC bitovo presne (sada IETF, kodéry flac a FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Rozhodcovia (referenčný kodér flac, FFmpeg)
        run: sh nastroje/balicky.sh flac ffmpeg
      - name: Skúšobné súbory FLAC IETF CELLAR (CC0, len na čítanie)
        run: git clone --depth 1 https://github.com/ietf-wg-cellar/flac-test-files "$RUNNER_TEMP/flac-test-files"
      - name: Zostavenie
        run: cargo build --locked --release -p orchidea-media --example media_flac
      - name: MD5 dekódovania proti MD5 v STREAMINFO
        shell: bash
        run: |
          echo "### Médiá – FLAC (RFC 9639) bitovo presne" >> "$GITHUB_STEP_SUMMARY"
          python3 media/nastroje/over_flac.py target/release/examples/media_flac "$RUNNER_TEMP/flac-test-files" "$RUNNER_TEMP/flac" | tee -a "$GITHUB_STEP_SUMMARY"

  fuzzer:
    name: Médiá – dlhý fuzzer čítačiek (R211)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Fuzzer – 4 semienka po 2 milióny pokusov
        shell: bash
        run: |
          for s in 1 2 3 4; do
            ORCHIDEA_FUZZER=2000000 ORCHIDEA_FUZZER_SEMIENKO=$s cargo test --locked --release -p orchidea-media --test fuzzer
          done
