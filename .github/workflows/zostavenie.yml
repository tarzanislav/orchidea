name: Zostavenie a skúšky

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  kontrola:
    name: Formát a kontrola kódu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets

  skusky:
    name: Skúšky – ${{ matrix.meno }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { meno: "Linux x86-64", os: ubuntu-latest, gpu: Vulkan }
          - { meno: "Linux ARM64", os: ubuntu-24.04-arm, gpu: Vulkan }
          - { meno: "Windows x86-64", os: windows-latest, gpu: D3d12 }
          - { meno: "macOS ARM64", os: macos-latest, gpu: Metal }
    runs-on: ${{ matrix.os }}
    env:
      # skúšky GPU zlyhajú, ak sa zariadenie nenájde – nič neprejde potichu
      ORCHIDEA_VYZADUJ_GPU: ${{ matrix.gpu }}
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Softvérový Vulkan (lavapipe) pre skúšky GPU
        if: runner.os == 'Linux'
        run: |
          sh nastroje/balicky.sh mesa-vulkan-drivers libvulkan1
      - name: Dostupné výpočtové zariadenia
        shell: bash
        run: |
          echo "### Zariadenia – ${{ matrix.meno }}" >> "$GITHUB_STEP_SUMMARY"
          cargo run --locked -p orchidea-gpu --example zariadenia | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Skúšky (ladiaci preklad)
        run: cargo test --locked --workspace
      - name: Skúšky (optimalizovaný preklad)
        run: cargo test --locked --workspace --release
      - name: Meranie výkonu
        shell: bash
        run: |
          echo "### Meranie – ${{ matrix.meno }}" >> "$GITHUB_STEP_SUMMARY"
          cargo run --locked --release -p orchidea-neuron --example meranie | tee -a "$GITHUB_STEP_SUMMARY"
          cargo run --locked --release -p orchidea-gpu --example vektor | tee -a "$GITHUB_STEP_SUMMARY"

  slabe:
    name: Skúšky – slabé zariadenie (ARM64, 4 jadrá, 1 GB, bez GPU)
    # profil Raspberry Pi 3/4 a starších kancelárskych PC: skúšky bežia v kontajneri s tvrdým obmedzením
    # pamäte a jadier, bez GPU – všetko musí fungovať aj tak
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Zostavenie skúšok a meraní
        run: |
          cargo test --locked --workspace --release --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > binarky.txt
          cargo build --locked --workspace --release --examples
          cat binarky.txt
      - name: Skúšky v obmedzenom kontajneri
        run: |
          for b in $(cat binarky.txt); do
            echo "== $b"
            docker run --rm --memory=1g --memory-swap=1g --cpus=4 -e ORCHIDEA_BEZ_GPU=1 \
              -v "$PWD:$PWD" -w "$PWD" ubuntu:24.04 "$b" || exit 1
          done
      - name: Meranie v obmedzenom kontajneri
        run: |
          echo "### Meranie – slabé zariadenie (4 jadrá, 1 GB, bez GPU)" >> "$GITHUB_STEP_SUMMARY"
          for e in meranie vektor; do
            docker run --rm --memory=1g --memory-swap=1g --cpus=4 -e ORCHIDEA_BEZ_GPU=1 \
              -v "$PWD:$PWD" -w "$PWD" ubuntu:24.04 "target/release/examples/$e" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Balík pre skutočné Raspberry Pi (64-bit – RPi 3, 4, 5, Zero 2)
        run: sh nastroje/rpi_balik.sh orchidea-rpi-64bit target/release/examples < binarky.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orchidea-rpi-64bit
          path: orchidea-rpi-64bit

  rpi32:
    name: Skúšky – Raspberry Pi 32-bit (ARMv7, QEMU)
    runs-on: ubuntu-latest
    env:
      ORCHIDEA_BEZ_GPU: "1"
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač a cieľ ARMv7
        run: |
          rustup toolchain install && rustup show
          rustup target add armv7-unknown-linux-gnueabihf
      - name: Krížový linker a QEMU
        run: |
          sh nastroje/balicky.sh gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Skúšky (32-bitový ARM, bitová zhoda s ostatnými platformami)
        run: cargo test --locked --workspace --release --target armv7-unknown-linux-gnueabihf
      - name: Balík pre skutočné Raspberry Pi (32-bit ARMv7 – RPi 2, 3, 4)
        run: |
          cargo test --locked --workspace --release --target armv7-unknown-linux-gnueabihf --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > binarky.txt
          cargo build --locked --workspace --release --examples --target armv7-unknown-linux-gnueabihf
          sh nastroje/rpi_balik.sh orchidea-rpi-32bit-armv7 target/armv7-unknown-linux-gnueabihf/release/examples < binarky.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orchidea-rpi-32bit-armv7
          path: orchidea-rpi-32bit-armv7

  rpi1:
    name: Skúšky – Raspberry Pi 1 a Zero (ARMv6 – procesor ARM1176, 1 jadro, 512 MB, QEMU)
    runs-on: ubuntu-latest
    env:
      # statický program s knižnicou musl pre ARMv6: knižnice a štartovací kód Ubuntu sú pre ARMv7
      # a na RPi 1 a Zero by program spadol hneď pri štarte (neplatná inštrukcia)
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač a cieľ ARMv6
        run: |
          rustup toolchain install && rustup show
          rustup target add arm-unknown-linux-musleabihf
      - name: Krížový linker a QEMU
        run: |
          sh nastroje/balicky.sh gcc-arm-linux-gnueabihf
          printf 'FROM ubuntu:24.04\nCOPY balicky.sh /\nRUN sh /balicky.sh qemu-user\n' | docker build -q -t rpi1 -f - nastroje
      - name: Zostavenie skúšok pre ARMv6
        run: |
          cargo test --locked --workspace --release --target arm-unknown-linux-musleabihf --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > binarky.txt
          cat binarky.txt
      - name: Skúšky v kontajneri – procesor ARM1176 (ako RPi 1 a Zero), 1 jadro, 512 MB, bez GPU
        run: |
          for b in $(cat binarky.txt); do
            echo "== $b"
            docker run --rm --memory=512m --memory-swap=512m --cpus=1 -e ORCHIDEA_BEZ_GPU=1 \
              -v "$PWD:$PWD" -w "$PWD" rpi1 qemu-arm -cpu arm1176 "$b" || exit 1
          done
      - name: Balík pre skutočné Raspberry Pi (32-bit ARMv6 – RPi 1, Zero, Zero W; statický, beží na každom systéme)
        run: |
          cargo build --locked --workspace --release --examples --target arm-unknown-linux-musleabihf
          sh nastroje/rpi_balik.sh orchidea-rpi-32bit-armv6 target/arm-unknown-linux-musleabihf/release/examples < binarky.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orchidea-rpi-32bit-armv6
          path: orchidea-rpi-32bit-armv6

  sadic-iso:
    name: SADIČ – formátovanie a ISO (Linux, nezávislé fsck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Nástroje na nezávislú kontrolu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dosfstools exfatprogs mtools gdisk xorriso isolinux syslinux-common genisoimage ntfs-3g
      - name: Zostavenie
        run: cargo build --locked --release -p sklenik-sadic
      - name: Formátovanie, rozbor ISO, napálenie, súbor nad 4 GB, skutočné ISO
        run: |
          sudo mkdir -p /mnt/sadic && sudo chown "$USER" /mnt/sadic
          bash nastroje/skuska_sadica.sh target/release/sadic /mnt/sadic
      - uses: actions/upload-artifact@v4
        with:
          name: sadic-iso-skusky
          path: |
            /mnt/sadic/hybrid.iso
            /mnt/sadic/win.iso

  sadic:
    name: SADIČ – zápis na virtuálny disk (Windows)
    runs-on: windows-latest
    needs: sadic-iso
    env:
      SADIC_SKUSKA: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sadic-iso-skusky
          path: ${{ runner.temp }}/iso
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Zostavenie
        run: cargo build --locked --release -p sklenik-sadic
      - name: Zápis, poistky, overenie, záloha a obnova na virtuálnom disku
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $s = "target\release\sadic.exe"
          $t = $env:RUNNER_TEMP
          $img = "$t\skuska.img"; $vhd = "$t\skuska.vhd"
          & $s skusobny-obraz $img 64; if ($LASTEXITCODE) { throw "skúšobný obraz" }
          "create vdisk file=`"$vhd`" maximum=96 type=fixed`r`nattach vdisk" | Out-File -Encoding ascii "$t\dp1.txt"
          diskpart /s "$t\dp1.txt" | Out-Null
          $n = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          Write-Output "virtuálny disk: $n"
          & $s zoznam --dovol-virtualny
          $sys = (Get-Partition -DriveLetter C | Get-Disk).Number
          & $s zapis $img $sys --potvrdzujem $sys --dovol-virtualny
          if ($LASTEXITCODE -ne 2) { throw "POISTKA: systémový disk nebol odmietnutý (kód $LASTEXITCODE)" }
          & $s zapis $img $n --potvrdzujem $n
          if ($LASTEXITCODE -ne 2) { throw "POISTKA: virtuálny disk bez povolenia nebol odmietnutý ($LASTEXITCODE)" }
          & $s zapis $img $n --potvrdzujem 999 --dovol-virtualny
          if ($LASTEXITCODE -ne 2) { throw "POISTKA: zlé potvrdenie nebolo odmietnuté ($LASTEXITCODE)" }
          & $s zapis $img $n --potvrdzujem $n --dovol-virtualny meno=skuska wifi=Domov wifi_heslo=tajneheslo jazyk=sk
          if ($LASTEXITCODE) { throw "zápis zlyhal" }
          Update-Disk -Number $n
          Start-Sleep -Seconds 3
          $p = Get-Partition -DiskNumber $n | Select-Object -First 1
          if (-not $p.DriveLetter -or $p.DriveLetter -eq [char]0) {
            $p | Add-PartitionAccessPath -AssignDriveLetter
            $p = Get-Partition -DiskNumber $n -PartitionNumber $p.PartitionNumber
          }
          $obsah = Get-Content "$($p.DriveLetter):\SKLENIK.TXT" -Raw
          Write-Output $obsah
          if ($obsah -notmatch 'meno=skuska' -or $obsah -match 'tajneheslo') { throw "nastavenie na karte nesedí" }
          & $s zaloha $n "$t\zaloha.img" --dovol-virtualny
          if ($LASTEXITCODE) { throw "záloha zlyhala" }
          & $s obnov $img $n --potvrdzujem $n --dovol-virtualny
          if ($LASTEXITCODE) { throw "obnova na pripojený oddiel zlyhala" }
          # okno SADIČA: obraz priamo zo ZIP (ako stiahnutý z GitHubu), karta a meno sa vyplnia samy
          Compress-Archive -Path $img -DestinationPath "$t\sklenik-skuska.zip" -Force
          $env:SADIC_SKUSKA_OKNA = "$t\sklenik-skuska.zip|$n|Dielňa Č 1"
          $vystup = & $s --dovol-virtualny 2>&1 | Out-String
          $kod = $LASTEXITCODE
          Remove-Item Env:SADIC_SKUSKA_OKNA
          Write-Output $vystup
          if ($kod -or $vystup -notmatch 'zapísané a overené') { throw "okno: zápis zo ZIP zlyhal (kód $kod)" }
          Update-Disk -Number $n
          Start-Sleep -Seconds 3
          $p = Get-Partition -DiskNumber $n | Select-Object -First 1
          if (-not $p.DriveLetter -or $p.DriveLetter -eq [char]0) {
            $p | Add-PartitionAccessPath -AssignDriveLetter
            $p = Get-Partition -DiskNumber $n -PartitionNumber $p.PartitionNumber
          }
          $obsah = Get-Content "$($p.DriveLetter):\SKLENIK.TXT" -Raw
          Write-Output $obsah
          if ($obsah -notmatch 'meno=dielna-c-1') { throw "okno: meno zariadenia na karte nesedí" }
          # ---- rozšírený režim: napálenie ISO, formátovanie, kontrola karty ----
          $iso = "$t\iso"
          & $s skumaj "$iso\hybrid.iso"; if ($LASTEXITCODE) { throw "rozbor hybridného ISO" }
          & $s napal "$iso\hybrid.iso" $n --potvrdzujem $n --dovol-virtualny
          if ($LASTEXITCODE) { throw "napálenie hybridného ISO zlyhalo" }
          & $s napal "$iso\win.iso" $n --potvrdzujem $n --dovol-virtualny
          if ($LASTEXITCODE) { throw "napálenie ISO Windows (rozbalenie súborov) zlyhalo" }
          function Pismeno($n) {
            Update-Disk -Number $n
            Start-Sleep -Seconds 3
            $p = Get-Partition -DiskNumber $n | Where-Object { $_.Type -ne 'Reserved' } | Select-Object -First 1
            if (-not $p.DriveLetter -or $p.DriveLetter -eq [char]0) {
              $p | Add-PartitionAccessPath -AssignDriveLetter
              $p = Get-Partition -DiskNumber $n -PartitionNumber $p.PartitionNumber
            }
            return $p.DriveLetter
          }
          $l = Pismeno $n
          $usb = "${l}:\"
          $m = Mount-DiskImage -ImagePath "$iso\win.iso" -PassThru
          $cd = "$(($m | Get-Volume).DriveLetter):\"
          $chyby = 0; $pocet = 0
          Get-ChildItem -LiteralPath $cd -Recurse -File | Where-Object { $_.Name -ne 'boot.catalog' } | ForEach-Object {
            $rel = $_.FullName.Substring($cd.Length)
            $kopia = Join-Path $usb $rel
            $pocet++
            if (-not (Test-Path -LiteralPath $kopia)) { Write-Output "chýba: $rel"; $chyby++ }
            elseif ((Get-FileHash -LiteralPath $_.FullName).Hash -ne (Get-FileHash -LiteralPath $kopia).Hash) {
              Write-Output "iný obsah: $rel"; $chyby++
            }
          }
          Dismount-DiskImage -ImagePath "$iso\win.iso" | Out-Null
          if ($chyby -or $pocet -lt 60) { throw "ISO Windows na USB nesedí ($chyby chýb z $pocet súborov)" }
          $v = Get-Volume -DriveLetter $l
          if ($v.FileSystem -ne 'FAT32') { throw "ISO Windows: čakal som FAT32, je $($v.FileSystem)" }
          Write-Output "✅ ISO Windows rozbalené na FAT32 – Windows číta všetkých $pocet súborov rovnako ako z ISO"
          # ISO Windows s nízkou hranicou: sources (okrem boot.wim) na druhom oddiele NTFS
          $env:SADIC_SKUSKA_HRANICA = "50000"
          & $s napal "$iso\win.iso" $n --potvrdzujem $n --dovol-virtualny
          $kod = $LASTEXITCODE
          Remove-Item Env:SADIC_SKUSKA_HRANICA
          if ($kod) { throw "napálenie ISO Windows na FAT32 + NTFS zlyhalo" }
          Update-Disk -Number $n
          Start-Sleep -Seconds 3
          $pis = @{}
          foreach ($c in 1, 2) {
            $p = Get-Partition -DiskNumber $n -PartitionNumber $c
            if (-not $p.DriveLetter -or $p.DriveLetter -eq [char]0) {
              $p | Add-PartitionAccessPath -AssignDriveLetter
              $p = Get-Partition -DiskNumber $n -PartitionNumber $c
            }
            $pis[$c] = $p.DriveLetter
          }
          Write-Output "oddiel 1: $((Get-Volume -DriveLetter $pis[1]).FileSystem), oddiel 2: $((Get-Volume -DriveLetter $pis[2]).FileSystem)"
          if ((Get-Volume -DriveLetter $pis[2]).FileSystem -ne 'NTFS') { throw "druhý oddiel nie je NTFS" }
          $m = Mount-DiskImage -ImagePath "$iso\win.iso" -PassThru
          $cd = "$(($m | Get-Volume).DriveLetter):\"
          $chyby = 0; $pocet = 0
          Get-ChildItem -LiteralPath $cd -Recurse -File | Where-Object { $_.Name -ne 'boot.catalog' } | ForEach-Object {
            $rel = $_.FullName.Substring($cd.Length)
            $na2 = $rel -like 'sources\*' -and $rel -ne 'sources\boot.wim'
            $kopia = Join-Path "$(if ($na2) { $pis[2] } else { $pis[1] }):\" $rel
            $pocet++
            if (-not (Test-Path -LiteralPath $kopia)) { Write-Output "chýba: $kopia"; $chyby++ }
            elseif ((Get-FileHash -LiteralPath $_.FullName).Hash -ne (Get-FileHash -LiteralPath $kopia).Hash) {
              Write-Output "iný obsah: $kopia"; $chyby++
            }
          }
          Dismount-DiskImage -ImagePath "$iso\win.iso" | Out-Null
          if ($chyby) { throw "FAT32 + NTFS: $chyby chýb z $pocet súborov" }
          $kontrola = chkdsk "$($pis[2]):" 2>&1 | Out-String
          Write-Output $kontrola
          if ($kontrola -notmatch 'found no problems') { throw "chkdsk našiel chyby v NTFS so súbormi z ISO" }
          Write-Output "✅ FAT32 + NTFS: Windows číta všetkých $pocet súborov rovnako ako z ISO, chkdsk bez chýb"
          foreach ($f in @(@('ntfs', 'mbr', 'NTFSKA', 'NTFS'), @('ntfs', 'gpt', 'NTFS_GPT', 'NTFS'), @('exfat', 'gpt', 'SKUSKA', 'exFAT'), @('fat32', 'mbr', 'KARTA', 'FAT32'))) {
            & $s formatuj $n $f[0] $f[1] "menovka=$($f[2])" --potvrdzujem $n --dovol-virtualny
            if ($LASTEXITCODE) { throw "formátovanie $($f[0]) zlyhalo" }
            $l = Pismeno $n
            $v = Get-Volume -DriveLetter $l
            Write-Output "Windows vidí: $($v.FileSystem) '$($v.FileSystemLabel)' $($v.Size) B"
            if ($v.FileSystem -ne $f[3] -or $v.FileSystemLabel -ne $f[2]) { throw "formátovanie: Windows vidí $($v.FileSystem) '$($v.FileSystemLabel)'" }
            Set-Content -LiteralPath "${l}:\skuska.txt" -Value 'Ahoj zo SADICA'
            if ((Get-Content -LiteralPath "${l}:\skuska.txt") -ne 'Ahoj zo SADICA') { throw "zápis súboru na naformátovaný disk" }
            $kontrola = chkdsk "${l}:" 2>&1 | Out-String
            $kod = $LASTEXITCODE
            Write-Output $kontrola
            if ($kontrola -notmatch 'found no problems') { throw "chkdsk našiel chyby v $($f[3]) (kód $kod)" }
          }
          # ext4: Windows ho nečíta, ale musí vidieť linuxový oddiel (kontrolu e2fsck robí linuxová úloha)
          foreach ($f in @(@('ext4', 'gpt', '{0fc63daf-8483-4772-8e79-3d69d8477de4}'), @('ext3', 'mbr', '131'))) {
            & $s formatuj $n $f[0] $f[1] "menovka=LINUX" --potvrdzujem $n --dovol-virtualny
            if ($LASTEXITCODE) { throw "formátovanie $($f[0]) zlyhalo" }
            Update-Disk -Number $n
            Start-Sleep -Seconds 2
            $p = Get-Partition -DiskNumber $n | Select-Object -First 1
            $typ = if ($f[1] -eq 'gpt') { "$($p.GptType)" } else { "$($p.MbrType)" }
            Write-Output "Windows vidí oddiel $($f[0]): typ $typ, $($p.Size) B"
            if ($typ -ne $f[2]) { throw "$($f[0]): typ oddielu $typ, čakal som $($f[2])" }
          }
          $vystup = & $s skontroluj $n --potvrdzujem $n --dovol-virtualny 2>&1 | Out-String
          $kod = $LASTEXITCODE
          Write-Output $vystup
          if ($kod -or $vystup -notmatch 'je skutočná') { throw "kontrola karty zlyhala (kód $kod)" }
          # okno v rozšírenom režime: formátovanie a napálenie ISO
          $env:SADIC_SKUSKA_ROZSIRENE = "formatuj|$n|exfat:OKNO"
          $vystup = & $s --dovol-virtualny 2>&1 | Out-String
          $kod = $LASTEXITCODE
          Write-Output $vystup
          if ($kod -or $vystup -notmatch 'okno: ✅ exFAT') { throw "okno: formátovanie zlyhalo (kód $kod)" }
          $l = Pismeno $n
          if ((Get-Volume -DriveLetter $l).FileSystemLabel -ne 'OKNO') { throw "okno: menovka nesedí" }
          $env:SADIC_SKUSKA_ROZSIRENE = "napal|$n|$iso\win.iso"
          $vystup = & $s --dovol-virtualny 2>&1 | Out-String
          $kod = $LASTEXITCODE
          Remove-Item Env:SADIC_SKUSKA_ROZSIRENE
          Write-Output $vystup
          if ($kod -or $vystup -notmatch 'okno: ✅ Rozbalené') { throw "okno: napálenie ISO zlyhalo (kód $kod)" }
          Write-Output "✅ SADIČ rozšírený: ISO (bit po bite aj rozbalením), FAT32/exFAT, MBR/GPT, kontrola karty, okno"
          "select vdisk file=`"$vhd`"`r`ndetach vdisk" | Out-File -Encoding ascii "$t\dp2.txt"
          diskpart /s "$t\dp2.txt" | Out-Null
          Write-Output "✅ SADIČ: zápis s overením, poistky, nastavenie, záloha, obnova a okno (obraz zo ZIP)"
      - uses: actions/upload-artifact@v4
        with:
          name: sadic-windows-x64
          path: target/release/sadic.exe

  shadery:
    name: Overenie shaderov – ${{ matrix.meno }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { meno: "SPIR-V a WGSL", os: ubuntu-latest }
          - { meno: "HLSL", os: windows-latest }
          - { meno: "MSL", os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Vygenerovanie shaderov vlastným prekladačom
        run: cargo run --locked -p orchidea-gpu --example shadery -- shadery
      - name: SPIR-V (spirv-val) a WGSL (naga)
        if: runner.os == 'Linux'
        run: |
          sh nastroje/balicky.sh spirv-tools
          for f in shadery/*.spv; do echo "$f"; spirv-val --target-env vulkan1.1 "$f"; done
          cargo install naga-cli --locked --root "$HOME/naga"
          for f in shadery/*.wgsl; do echo "$f"; "$HOME/naga/bin/naga" "$f"; done
      - name: HLSL (dxc – Shader Model 6.0, fxc – Shader Model 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $dxc = (Get-ChildItem $sdk -Recurse -Filter dxc.exe | Where-Object FullName -match '\\x64\\' | Select-Object -Last 1).FullName
          $fxc = (Get-ChildItem $sdk -Recurse -Filter fxc.exe | Where-Object FullName -match '\\x64\\' | Select-Object -Last 1).FullName
          Write-Output "dxc: $dxc"; Write-Output "fxc: $fxc"
          foreach ($f in Get-ChildItem shadery -Filter *.hlsl) {
            Write-Output $f.Name
            & $dxc -nologo -T cs_6_0 -E hlavna $f.FullName -Fo "$($f.FullName).dxil"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            & $fxc /nologo /T cs_5_1 /E hlavna $f.FullName /Fo "$($f.FullName).dxbc"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: MSL (xcrun metal)
        if: runner.os == 'macOS'
        run: |
          for f in shadery/*.metal; do echo "$f"; xcrun -sdk macosx metal -c "$f" -o "$f.air"; done

  web:
    name: Skúšky – web (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač a cieľ WebAssembly
        run: |
          rustup toolchain install && rustup show
          rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - name: Wasmtime (nezávislý spúšťač skúšok)
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Skúšky vo WebAssembly
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --dir=."
        run: cargo test --locked --workspace --target wasm32-wasip1
      - name: Zostavenie pre prehliadač
        run: cargo build --locked --workspace --release --target wasm32-unknown-unknown

  android:
    name: Skúšky – Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač a ciele Androidu
        run: |
          rustup toolchain install && rustup show
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Zostavenie skúšok (ARM64 a x86-64)
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android30-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android30-clang"
          cargo test --locked --workspace --release --target aarch64-linux-android --no-run
          cargo test --locked --workspace --release --target x86_64-linux-android --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > binarky.txt
          cat binarky.txt
      - name: Povolenie KVM pre emulátor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Skúšky v emulátore Androidu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: sh nastroje/android_skusky.sh
