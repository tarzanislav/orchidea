name: Charta a zdroje

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Charta a register zdrojov
        run: python3 -I nastroje/kontrola_zdrojov.py

      - name: Podpis príspevkov (DCO)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          chyba=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "CHYBA: commit $c nemá riadok Signed-off-by (použi git commit -s)"
              chyba=1
            fi
          done
          exit $chyba
