name: HEVC – rozbor a vlastný dekodér (R214)

# Prúd B (HEVC na Raspberry Pi): beží len pri zmene balíkov hevc a hevc-dekoder – ostatné prúdy nebrzdí.
# Skúšobné toky normy ITU-T/JCT-VC (celá sada HEVC_v1) a toky x265:
# - H0/H1: každá parametrická sada, hlavička rezu a príprava parametrov V4L2 sa prečíta bez chyby,
# - H2–H6: vlastný dekodér je bitovo presný – MD5 každého obrazu zo SEI a MD5 celého výstupu YUV.
on:
  push:
    paths:
      - "hevc/**"
      - "hevc-dekoder/**"
      - "jadro/**"
      - "Cargo.lock"
      - ".github/workflows/hevc.yml"
  pull_request:
    paths:
      - "hevc/**"
      - "hevc-dekoder/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  toky:
    name: HEVC – ${{ matrix.meno }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { meno: "Linux x86-64", os: ubuntu-latest }
          - { meno: "Linux ARM64 (ako Raspberry Pi 3/4/5)", os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač podľa rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - name: Zoznam skúšobných tokov normy (HEVC_v1)
        id: zoznam
        shell: bash
        run: |
          zaklad=https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/HEVC_v1
          curl -sSfL --retry 3 "$zaklad/" | grep -oE '[A-Za-z0-9_.-]+\.zip' | sort -u > zoznam.txt || true
          echo "tokov v zozname: $(wc -l < zoznam.txt)"
          echo "kluc=$(sha256sum zoznam.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pamat
        with:
          path: toky/norma
          key: hevc-v1-${{ steps.zoznam.outputs.kluc }}
      - name: Stiahnutie tokov normy
        if: steps.pamat.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sh nastroje/balicky.sh unzip
          zaklad=https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/HEVC_v1
          mkdir -p toky/norma toky/zip
          stiahnute=0
          while read -r z; do
            m="${z%.zip}"
            if curl -sSfL --retry 3 -o "toky/zip/$z" "$zaklad/$z" && unzip -qo "toky/zip/$z" -d "toky/norma/$m"; then
              stiahnute=$((stiahnute + 1))
            else
              echo "::warning::skúšobný tok $m sa nepodarilo stiahnuť"
            fi
            rm -f "toky/zip/$z"
          done < zoznam.txt
          echo "stiahnuté toky normy: $stiahnute"
      - name: Toky x265 (nástroje, ktoré v norme nie sú pokope)
        shell: bash
        run: |
          sh nastroje/balicky.sh ffmpeg
          mkdir -p toky/x265
          z="-hide_banner -loglevel error -y -f lavfi"
          gen() { ffmpeg $z -i "$2" -frames:v "$3" -c:v libx265 -pix_fmt yuv420p -x265-params "log-level=error:hash=1:$4" "toky/x265/$1.hevc"; }
          s1="testsrc2=size=352x288:rate=25,noise=alls=12:allf=t"
          s2="testsrc2=size=416x240:rate=25"
          gen intra "$s1" 4 "keyint=1:tskip=1:signhide=1"
          gen b "$s1" 16 "bframes=3:b-pyramid=1:ref=4"
          gen vahy "mandelbrot=size=320x192:rate=25" 12 "bframes=3:weightp=1:weightb=1"
          gen wpp_rezy "$s2" 8 "wpp=1:slices=3:bframes=2:ctu=32"
          gen amp_aq "$s1" 8 "amp=1:rect=1:aq-mode=2:qg-size=16:cbqpoffs=-2:crqpoffs=3"
          gen matice_opengop "$s2" 16 "scaling-list=default:keyint=8:open-gop=1:bframes=3"
          gen bezstratovy "$s2" 3 "lossless=1:bframes=1"
          gen hd "testsrc2=size=1280x720:rate=25" 10 "bframes=3"
          # Main 10 (HDR filmy): odtlačok MD5 (hash=1) a kontrolný súčet (hash=3)
          gen10() { ffmpeg $z -i "$2" -frames:v "$3" -c:v libx265 -pix_fmt yuv420p10le -x265-params "log-level=error:$4" "toky/x265/$1.hevc"; }
          gen10 main10_b "$s1" 16 "hash=1:bframes=3:b-pyramid=1:weightp=1:weightb=1"
          gen10 main10_sao "mandelbrot=size=352x288:rate=25" 12 "hash=3:sao=1:amp=1:wpp=1"
      - name: Rozbor syntaxe a príprava V4L2 (H0, H1)
        shell: bash
        run: |
          echo "### HEVC – rozbor syntaxe a príprava V4L2 (H0, H1) – ${{ matrix.meno }}" >> "$GITHUB_STEP_SUMMARY"
          cargo run --locked --release -p orchidea-hevc --example hevc_rozbor -- toky | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Skúšky dekodéra (na ARM64 aj NEON proti skalárnemu rozhodcovi)
        run: cargo test --locked --release -p orchidea-hevc-dekoder
      - name: Vlastný dekodér – bitová zhoda (H2–H5)
        shell: bash
        env:
          ORCHIDEA_HEVC_PRISNE: "1"
        run: |
          echo "### HEVC – vlastný dekodér, bitová zhoda MD5 (H2–H5, všetky jadrá) – ${{ matrix.meno }}" >> "$GITHUB_STEP_SUMMARY"
          cargo run --locked --release -p orchidea-hevc-dekoder --example hevc_dekoduj -- toky | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vlastný dekodér – rovnaký výsledok v jednom vlákne (H5)
        shell: bash
        env:
          ORCHIDEA_HEVC_PRISNE: "1"
          ORCHIDEA_HEVC_VLAKNA: "1"
        run: |
          echo "### HEVC – vlastný dekodér v jednom vlákne – ${{ matrix.meno }}" >> "$GITHUB_STEP_SUMMARY"
          cargo run --locked --release -p orchidea-hevc-dekoder --example hevc_dekoduj -- toky > jedno.txt || {
            cat jedno.txt | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          tail -n 1 jedno.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rýchlosť dekódovania (H5)
        shell: bash
        env:
          ORCHIDEA_HEVC_RYCHLOST: "1"
        run: |
          echo "### HEVC – rýchlosť (obr./s, bez overovania) – ${{ matrix.meno }}, jadier: $(nproc)" >> "$GITHUB_STEP_SUMMARY"
          vyber=$(ls -d toky/norma/PICSIZE_A* toky/norma/PICSIZE_C* toky/norma/AMP_D* toky/norma/TILES_A* \
            toky/norma/WPP_D_ericsson_MAIN_* toky/x265 2>/dev/null || true)
          for n in 1 2 4; do
            echo "**Vlákien: $n**" >> "$GITHUB_STEP_SUMMARY"
            ORCHIDEA_HEVC_VLAKNA=$n cargo run --locked --release -q -p orchidea-hevc-dekoder --example hevc_dekoduj -- \
              $vyber | grep -E '^\|' | cut -d'|' -f1-3,8,10 | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Balík na meranie na Raspberry Pi (64-bit – RPi 3, 4, 5, Zero 2 W)
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          b=orchidea-hevc-rpi-64bit
          mkdir -p "$b/toky"
          z="-hide_banner -loglevel error -y -f lavfi"
          film() {
            ffmpeg $z -i "testsrc2=size=$2:rate=24" -frames:v 96 -c:v libx265 -preset fast -crf 23 -pix_fmt yuv420p \
              -x265-params "log-level=error:hash=1" "$b/toky/$1.hevc"
          }
          film film720 1280x720
          film film1080 1920x1080
          for d in toky/norma/AMP_D* toky/norma/TILES_A* toky/norma/WPP_D_ericsson_MAIN_*; do
            if [ -d "$d" ]; then cp -r "$d" "$b/toky/"; fi
          done
          # balík pre dosky: plánovanie inštrukcií pre Cortex-A53 (RPi 3, Zero 2 W; RPi 4 a 5 – ARMv8.0 stačí)
          RUSTFLAGS="-D warnings -C target-cpu=cortex-a53" cargo build --locked --release -p orchidea-hevc-dekoder \
            --example hevc_dekoduj --example hevc_meranie --target-dir target-a53
          r=target-a53/release/examples
          cp "$r/hevc_dekoduj" "$r/hevc_meranie" hevc-dekoder/rpi/meraj_hevc.sh "$b/"
          chmod +x "$b/hevc_dekoduj" "$b/hevc_meranie" "$b/meraj_hevc.sh"
          # rovnaký výsledok ako všeobecná zostava (bitová zhoda na skúšobných tokoch balíka)
          for f in "$b"/toky/*.hevc; do "$b/hevc_meranie" "$f" | tail -n 1; done
          du -sh "$b"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04-arm'
        with:
          name: orchidea-hevc-rpi-64bit
          path: orchidea-hevc-rpi-64bit
          retention-days: 30

  rpi32:
    # 32-bitový systém na RPi 2/3/4 (Raspberry Pi OS 32-bit): ARMv7 s NEON (Cortex-A7/A53/A72 ho majú), skúška v QEMU
    name: HEVC – Raspberry Pi 32-bit (ARMv7 s NEON, QEMU)
    needs: toky
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C target-feature=+neon
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v5
      - name: Prekladač a cieľ ARMv7
        run: |
          rustup toolchain install && rustup show
          rustup target add armv7-unknown-linux-gnueabihf
      - name: Krížový linker, QEMU a FFmpeg
        run: sh nastroje/balicky.sh gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user ffmpeg
      - name: Zoznam skúšobných tokov normy (HEVC_v1)
        id: zoznam
        shell: bash
        run: |
          zaklad=https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/HEVC_v1
          curl -sSfL --retry 3 "$zaklad/" | grep -oE '[A-Za-z0-9_.-]+\.zip' | sort -u > zoznam.txt || true
          echo "kluc=$(sha256sum zoznam.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: toky/norma
          key: hevc-v1-${{ steps.zoznam.outputs.kluc }}
      - name: Vlastný dekodér na 32-bitovom ARM – bitová zhoda (QEMU)
        shell: bash
        env:
          ORCHIDEA_HEVC_PRISNE: "1"
        run: |
          cargo build --locked --release -p orchidea-hevc-dekoder --example hevc_dekoduj --example hevc_meranie \
            --target armv7-unknown-linux-gnueabihf
          echo "### HEVC – vlastný dekodér na 32-bitovom ARMv7 s NEON (QEMU)" >> "$GITHUB_STEP_SUMMARY"
          qemu-arm -L /usr/arm-linux-gnueabihf target/armv7-unknown-linux-gnueabihf/release/examples/hevc_dekoduj \
            toky/norma > armv7.txt || { cat armv7.txt | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          tail -n 1 armv7.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Balík na meranie na Raspberry Pi (32-bit ARMv7)
        shell: bash
        run: |
          b=orchidea-hevc-rpi-32bit-armv7
          mkdir -p "$b/toky"
          z="-hide_banner -loglevel error -y -f lavfi"
          film() {
            ffmpeg $z -i "testsrc2=size=$2:rate=24" -frames:v 96 -c:v libx265 -preset fast -crf 23 -pix_fmt yuv420p \
              -x265-params "log-level=error:hash=1" "$b/toky/$1.hevc"
          }
          film film720 1280x720
          film film1080 1920x1080
          for d in toky/norma/AMP_D* toky/norma/TILES_A* toky/norma/WPP_D_ericsson_MAIN_*; do
            if [ -d "$d" ]; then cp -r "$d" "$b/toky/"; fi
          done
          r=target/armv7-unknown-linux-gnueabihf/release/examples
          cp "$r/hevc_dekoduj" "$r/hevc_meranie" hevc-dekoder/rpi/meraj_hevc.sh "$b/"
          chmod +x "$b/hevc_dekoduj" "$b/hevc_meranie" "$b/meraj_hevc.sh"
          qemu-arm -L /usr/arm-linux-gnueabihf "$b/hevc_meranie" --vlakna 2 "$b/toky/film720.hevc" | tail -n 1
          du -sh "$b"
      - uses: actions/upload-artifact@v4
        with:
          name: orchidea-hevc-rpi-32bit-armv7
          path: orchidea-hevc-rpi-32bit-armv7
          retention-days: 30
